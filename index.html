t-size:12px;font-weight:650}.pill.selected{background:var(--fg);color:var(--bg)}.btn{background:var(--fg);color:var(--bg);border:0;border-radius:13px;padding:14px 18px;font-weight:700;width:100%;margin-top:10px}.btn.alt{background:var(--card);color:var(--fg)}.field{display:block;width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--fg);margin:9px 0 16px;outline:0}.label{font-size:13px;font-weight:700}.panel{background:var(--card);border-radius:18px;padding:17px;margin:13px 0}.storyrow{display:flex;gap:15px;overflow:auto;padding:18px 17px;scrollbar-width:none;border-bottom:1px solid var(--line)}.story{text-align:center;flex:0 0 65px;font-size:11px;color:var(--fg)}.avatar{height:60px;width:60px;border-radius:50%;border:2px solid var(--fg);padding:3px;object-fit:cover}.story .avatar{display:block;margin-bottom:6px}.post{border-bottom:1px solid var(--line);padding-bottom:17px}.posthead{display:flex;align-items:center;gap:10px;padding:12px 17px}.posthead img{width:36px;height:36px;border-radius:50%;object-fit:cover}.posthead b{font-size:13px}.posthead small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.postimage{display:block;width:100%;aspect-ratio:1.15;object-fit:cover;background:var(--card)}.postbuttons{display:flex;justify-content:space-between;padding:12px 15px 5px}.postbuttons .left{display:flex;gap:17px}.posttext{padding:2px 17px;font-size:13px;line-height:1.5}.posttext strong{font-weight:750}.postmeta{color:var(--muted);font-size:11px;padding:5px 17px}.feature{position:relative;border-radius:20px;overflow:hidden;background:#171717;color:#fff;min-height:205px;display:flex;align-items:end;padding:22px}.feature:before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#000c,#0001),url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1000&q=85') center/cover}.feature>*{position:relative}.feature h3{font-size:23px;margin:0 0 8px}.feature p{font-size:12px;color:#ddd;line-height:1.5;margin:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border-radius:16px;overflow:hidden;background:var(--card);position:relative;aspect-ratio:1}.tile img{width:100%;height:100%;object-fit:cover}.tile span{position:absolute;bottom:0;left:0;right:0;padding:18px 10px 10px;background:linear-gradient(transparent,#000a);color:white;font-size:12px;font-weight:700}.quick{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding:4px 0 12px}.listrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.listrow .thumb{width:56px;height:56px;object-fit:cover;border-radius:13px;background:var(--card)}.listrow .info{flex:1;min-width:0}.listrow b{font-size:13px}.listrow p{font-size:12px;color:var(--muted);margin:5px 0 0}.round{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:750}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:11px;color:var(--muted);padding:7px 0}.day{border:1px solid var(--line);background:var(--card);color:var(--fg);aspect-ratio:.83;border-radius:9px;position:relative;padding:4px;font-size:11px;text-align:left;overflow:hidden}.day img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.day img+span{position:absolute;top:3px;left:3px;background:#000b;color:#fff;padding:2px 4px;border-radius:4px}.day.current{outline:2px solid var(--fg)}.bubble{max-width:88%;padding:13px 15px;border-radius:18px;font-size:13px;line-height:1.5;background:var(--card);margin:12px 0}.bubble.mine{margin-left:auto;background:var(--fg);color:var(--bg)}.aihero{display:flex;align-items:center;gap:13px;padding:15px 0 22px}.spark{width:54px;height:54px;border-radius:16px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:29px}.tabs{display:flex;gap:8px;overflow:auto;scrollbar-width:none;margin:18px 0}.mini{font-size:11px;color:var(--muted)}.profilehero{he const icon=(name)=>{let d={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',plus:'<path d="M12 4v16M4 12h16"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',spark:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-8 16-8 16 0"/>',heart:'<path d="M20.8 4.6c-2-2-5.3-2-7.3 0L12 6l-1.5-1.4c-2-2-5.3-2-7.3 0s-2 5.2 0 7.2L12 21l8.8-9.2c2-2 2-5.2 0-7.2z"/>',message:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a9 9 0 0 1-.9-4A8.5 8.5 0 0 1 12.5 3 8.5 8.5 0 0 1 21 11.5z"/>',send:'<path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/>',bookmark:'<path d="M5 3h14v19l-7-5-7 5z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/>',moon:'<path d="M20 16A9 9 0 0 1 8 4 9 9 0 1 0 20 16z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',chevron:'<path d="m9 18 6-6-6-6"/>',camera:'<rect x="2" y="6" width="20" height="15" rx="2"/><circle cx="12" cy="13" r="4"/><path d="m7 6 2-3h6l2 3"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M2 20c0-7 14-7 14 0M17 5a3 3 0 0 1 0 6m2 4c2 1 3 3 3 5"/>',check:'<path d="m4 12 5 5L20 6"/>',back:'<path d="m15 18-6-6 6-6"/>'};return `<svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d[name]||d.spark}</svg>`};
const pics={lake:'https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1000&q=85',friends:'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=1000&q=85',coffee:'https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=900&q=85',hike:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=900&q=85',city:'https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=900&q=85',camera:'https://images.unsplash.com/photo-1452587925148-ce544e77e70d?w=900&q=85',portrait:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=250&q=75',portrait2:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=250&q=75',portrait3:'https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=250&q=75'};
const KEY='vyva_preview_2';const base={name:'',theme:'light',posts:[],experiences:[],routine:'',interests:'',budget:'',messages:[],likes:{}};let state;try{state={...base,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state={...base}}let page=state.name?'feed':'welcome',tab='Quero viver',createType='experiencia',photo='',selectedDay=null,calendarOffset=0,aiDraft='';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Armazenamento local cheio. Tente uma foto menor.')}};const go=p=>{page=p;window.scrollTo(0,0);render()};const toast=t=>{let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2700)};
function render(){document.body.classList.toggle('dark',state.theme==='dark'||(state.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches));document.querySelector('meta[name="theme-color"]').content=getComputedStyle(document.body).getPropertyValue('--bg').trim()||'#fff';$('header').style.display=page==='welcome'?'none':'flex';$('nav').style.display=page==='welcome'?'none':'flex';$('header').innerHTML=`<div class="brand" onclick="go('feed')">VYVA</div><div class="actions"><button class="ico" onclick="go('search')" aria-label="Pesquisar">${icon('search')}</button><button class="ico" onclick="go('notifications')" aria-label="Notificações">${icon('bell')}</button><button class="ico" onclick="go('settings')" aria-label="Configurações">${icon('settings')}</button></div>`;let navs=[['feed','home','Início'],['search','search','Explorar'],['create','plus','Criar'],['life','calendar','Minha vida'],['ai','spark','IA'],['profile','user','Perfil']];$('nav').innerHTML=`<div class="navin">${navs.map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span class="${p==='create'?'create-icon':''}">${icon(i)}</span>${t}</button>`).join('')}</div>`;let h='';if(page==='welcome')h=welcome();if(page==='feed')h=feed();if(page==='search')h=explore();if(page==='create')h=create();if(page==='life')h=life();if(page==='ai')h=ai();if(page==='profile')h=profile();if(page==='settings')h=settings();if(page==='notifications')h=notifications();if(page==='friends')h=friends();if(page==='messages')h=messages();if(page==='experience')h=experienceDetail();$('main').innerHTML=h}
function welcome(){return `<div class="welcome"><div class="logo">VYVA.</div><div class="feature" style="min-height:270px;margin-top:28px"><div><h3>Viva histórias que valem a pena contar.</h3><p>Descubra, crie e compartilhe experiências.</p></div></div><h1>Menos vontade guardada.<br>Mais vida acontecendo.</h1><p>Uma rede social para transformar ideias em experiências reais.</p><label class="label">Como você quer ser chamado(a)?</label><input id="name" class="field" placeholder="Seu nome"><button class="btn" onclick="start()">Começar a explorar →</button><p class="mini">Demonstração local: não cria uma conta online.</p></div>`}
function start(){let n=$('name').value.trim();if(!n)return toast('Digite seu nome');state.name=n;save();go('feed')}
function postCard(p,i){let demo=!!p.demo,liked=!!state.likes[p.id];return `<article class="post"><div class="posthead"><img src="${demo?p.avatar:pics.portrait}" alt=""><div style="flex:1"><b>${esc(p.author||state.name)}</b><small>${esc(p.place||'Minha experiência')} · ${esc(p.date||'Hoje')}</small></div><button class="ico" onclick="toast('Mais opções em breve')">···</button></div>${p.photo?`<img class="postimage" src="${p.photo}" alt="Foto da publicação">`:''}<div class="postbuttons"><div class="left"><button class="ico" onclick="like('${p.id}')" aria-label="Curtir" style="${liked?'color:var(--fg)':''}">${icon('heart')}</button><button class="ico" onclick="toast('Comentários disponíveis na próxima versão')">${icon('message')}</button><button class="ico" onclick="toast('Compartilhamento disponível na próxima versão')">${icon('send')}</button></div><button class="ico" onclick="toast('Publicação salva na demonstração')">${icon('bookmark')}</button></div><div class="posttext"><strong>${demo?p.likes+(liked?1:0):liked?1:0} curtidas</strong><br><strong>${esc(p.author||state.name)}</strong> ${esc(p.caption)}</div><div class="postmeta">Ver comentários · ${esc(p.date||'Hoje')}</div></article>`}
const demoPosts=[{id:'d1',demo:true,author:'ana.costa',avatar:pics.portrait,place:'Parque · Natureza',date:'há 2 h',photo:pics.lake,caption:'Hoje resolvi sair sem destino. Às vezes, é disso que a gente precisa. 🌿',likes:324},{id:'d2',demo:true,author:'lucas.ribeiro',avatar:pics.portrait2,place:'Com amigos',date:'ontem',photo:pics.friends,caption:'Uma tarde simples, muitas histórias para lembrar.',likes:186}];function feed(){return `<div class="storyrow">${[['Você',pics.portrait],['Ana',pics.portrait3],['Lucas',pics.portrait2],['Maria',pics.portrait],['Pedro',pics.portrait2]].map(([n,p])=>`<div class="story" onclick="toast('Stories serão adicionados depois')"><img class="avatar" src="${p}">${n}</div>`).join('')}</div><div class="section" style="padding-bottom:8px"><div class="feature"><div><span style="font-size:11px;letter-spacing:2px">✦ VYVA IA</span><h3>Sua próxima história começa aqui.</h3><p>Ideias para viver mais, do seu jeito.</p><button class="pill" style="background:#fff;color:#111;margin-top:12px" onclick="go('ai')">Descobrir experiências →</button></div></div></div>${[...state.posts].reverse().concat(demoPosts).map(postCard).join('')}<p class="mini" style="text-align:center;padding:20px">Publicações de demonstração. Rede social ainda não conectada.</p>`}
function like(id){state.likes[id]=!state.likes[id];save();render()}
function explore(){return `<div class="section"><h1 class="heading">Explorar</h1><p class="sub">Encontre inspiração para viver algo novo.</p><input class="field" id="searchtext" placeholder="Pesquisar experiências, pessoas, lugares" oninput="filterTiles(this.value)"><div class="quick">${['Tudo','Natureza','Gastronomia','Criatividade','Amigos'].map((x,i)=>`<button class="pill ${i===0?'selected':''}" onclick="toast('Filtro ${x} em desenvolvimento')">${x}</button>`).join('')}</div><div class="grid2" id="tiles">${[['Trilhas',pics.hike],['Cafés',pics.coffee],['Fotografia',pics.camera],['Viagens',pics.city],['Amizades',pics.friends],['Paisagens',pics.lake]].map(([n,p])=>`<div class="tile" data-name="${n.toLowerCase()}" onclick="go('create')"><img src="${p}" alt="${n}"><span>${n} →</span></div>`).join('')}</div><div class="panel"><b>✦ Não sabe por onde começar?</b><p class="sub">A VYVA IA pode te ajudar a escolher algo para experimentar.</p><button class="btn" onclick="go('ai')">Conversar com a IA</button></div></div>`}function filterTiles(v){document.querySelectorAll('[data-name]').forEach(x=>x.style.display=x.dataset.name.includes(v.toLowerCase())?'':'none')}
function create(){return `<div class="section"><h1 class="heading">Criar</h1><p class="sub">A vida também é feita das suas próprias ideias.</p><div class="tabs"><button class="pill ${createType==='experiencia'?'selected':''}" onclick="createType='experiencia';render()">Nova experiência</button><button class="pill ${createType==='post'?'selected':''}" onclick="createType='post';render()">Publicação</button></div>${createType==='experiencia'?`<label class="label">O que você quer viver?</label><input class="field" id="exptitle" placeholder="Ex.: Fazer uma trilha com amigos"><label class="label">Descreva sua ideia</label><textarea class="field" id="expdesc" rows="3" placeholder="O que torna essa experiência especial?"></textarea><label class="label">Quando?</label><select class="field" id="expwhen"><option>Sem data definida</option><option>Em breve</option><option>Este mês</option><option>Neste ano</option></select><label class="label">Quem pode ver?</label><select class="field" id="expprivacy"><option value="private">Só eu</option><option value="friends">Amigos (após conectar contas)</option><option value="public">Público (após conectar contas)</option></select><div class="notice">Você poderá convidar pessoas quando ativarmos as contas reais e os convites pelo Supabase.</div><button class="btn" onclick="addExperience()">Criar experiência →</button>`:`<label class="label">Compartilhe um momento</label><textarea class="field" id="caption" rows="4" placeholder="O que você viveu hoje?"></textarea><label class="label">Adicionar foto</label><input class="field" type="file" accept="image/*" onchange="loadPhoto(event)"><div id="preview"></div><button class="btn" onclick="publish()">Publicar no meu feed →</button><p class="mini">As fotos ficam somente neste navegador nesta demonstração.</p>`}</div>`}
function addExperience(){let title=$('exptitle').value.trim();if(!title)return toast('Escreva o nome da experiência');state.experiences.unshift({id:Date.now(),title,desc:$('expdesc').value.trim(),when:$('expwhen').value,privacy:$('expprivacy').value,status:'Quero viver',created:new Date().toISOString()});save();tab='Quero viver';go('life');toast('Experiência criada!')}
function loadPhoto(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,1000/img.width,1000/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.65);$('preview').innerHTML=`<img class="imgpreview" src="${photo}" alt="Prévia da foto">`};img.src=reader.result};reader.readAsDataURL(f)}
function publish(){let caption=$('caption').value.trim();if(!caption&&!photo)return toast('Adicione uma foto ou legenda');state.posts.push({id:'p'+Date.now(),caption,photo,created:new Date().toISOString(),date:new Date().toLocaleDateString('pt-BR'),author:state.name,likes:0});save();photo='';go('feed');toast('Publicado neste navegador!')}
function life(){let today=new Date(),m=new Date(today.getFullYear(),today.getMonth()+calendarOffset,1),year=m.getFullYear(),month=m.getMonth(),days=new Date(year,month+1,0).getDate(),start=new Date(year,month,1).getDay();let cells=Array.from({length:start},()=>'<div></div>').join('')+Array.from({length:days},(_,i)=>{let d=i+1,p=state.posts.filter(p=>{let t=new Date(p.created);return t.getFullYear()===year&&t.getMonth()===month&&t.getDate()===d&&p.photo}).at(-1);return `<button class="day ${selectedDay===d?'current':''}" onclick="selectedDay=${d};render()">${p?`<img src="${p.photo}" alt="Memória do dia ${d}"><span>${d}</span>`:d}</button>`}).join('');let matches=state.experiences.filter(x=>x.status===tab);let posts=selectedDay?state.posts.filter(p=>{let t=new Date(p.created);return t.getFullYear()===year&&t.getMonth()===month&&t.getDate()===selectedDay}):[];return `<div class="section"><h1 class="heading">Minha vida</h1><p class="sub">Uma coleção de tudo o que você quer viver e já viveu.</p><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><button class="ico" onclick="calendarOffset--;selectedDay=null;render()">${icon('back')}</button><b>${m.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button class="ico" onclick="calendarOffset++;selectedDay=null;render()">${icon('chevron')}</button></div><div class="cal">${['D','S','T','Q','Q','S','S'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div><p class="mini" style="margin-bottom:0">As fotos aparecem no dia em que você publicou.</p></div>${selectedDay?`<div class="panel"><b>${selectedDay} de ${m.toLocaleDateString('pt-BR',{month:'long'})}</b>${posts.length?posts.map(p=>`<p class="sub">${esc(p.caption||'Foto publicada')}</p>${p.photo?`<img class="cover" src="${p.photo}">`:''}`).join(''):'<p class="sub">Nenhuma publicação neste dia.</p>'}</div>`:''}<h2 style="font-size:19px;margin:25px 0 3px">Minhas experiências</h2><div class="tabs">${['Quero viver','Estou vivendo','Já vivi'].map(t=>`<button class="pill ${tab===t?'selected':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div>${matches.length?matches.map(x=>`<div class="listrow"><div class="round">✦</div><div class="info"><b>${esc(x.title)}</b><p>${esc(x.when)}</p></div><button class="ico" onclick="openExperience(${x.id})">${icon('chevron')}</button></div>`).join(''):'<div class="blank">Suas experiências aparecerão aqui.<br>Que tal criar a primeira?</div>'}<button class="btn alt" onclick="createType='experiencia';go('create')">＋ Criar experiência</button></div>`}
let activeExperience=null;function openExperience(id){activeExperience=id;go('experience')}function experienceDetail(){let x=state.experiences.find(x=>x.id===activeExperience);if(!x)return '<div class="section">Experiência não encontrada.</div>';return `<div class="section"><button class="ico" onclick="go('life')">${icon('back')}</button><div class="feature" style="margin:12px 0"><div><h3>${esc(x.title)}</h3><p>Uma experiência para viver no seu tempo.</p></div></div><h1 class="heading">${esc(x.title)}</h1><p class="sub">${esc(x.desc||'Sua próxima experiência começa com uma ideia.')}</p><div class="panel"><b>Status</b><select class="field" id="newstatus" onchange="changeStatus(${x.id},this.value)">${['Quero viver','Estou vivendo','Já vivi'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><b>Planejamento</b><p class="sub">${esc(x.when)}</p><b>Privacidade</b><p class="sub">${x.privacy==='private'?'Somente você':x.privacy==='friends'?'Amigos (pendente de integração)':'Pública (pendente de integração)'}</p></div><button class="btn" onclick="toast('Convites reais exigem login e banco de dados')">${icon('users')} Convidar amigos</button><button class="btn alt" onclick="deleteExperience(${x.id})">Excluir experiência</button></div>`}function changeStatus(id,status){let x=state.experiences.find(x=>x.id===id);x.status=status;save();toast('Status atualizado')}function deleteExperience(id){if(confirm('Excluir esta experiência?')){state.experiences=state.experiences.filter(x=>x.id!==id);save();go('life')}}
function ai(){return `<div class="section"><div class="aihero"><div class="spark">✦</div><div><h1 class="heading" style="margin:0">VYVA IA</h1><div class="sub">Ideias para viver mais, no seu ritmo.</div></div></div><div class="notice">Prévia do assistente. A IA real e a memória sincronizada serão ativadas após configurar o servidor.</div><div class="bubble">Oi, ${esc(state.name)}! O que você gostaria de viver hoje? Posso considerar sua rotina e seus interesses.</div>${state.messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('')}<div class="quick" style="margin-top:18px">${['Tenho pouco tempo','Quero algo gratuito','Quero fazer com amigos','Planejar meu feriado'].map(t=>`<button class="pill" onclick="askAI('${t}')">${t}</button>`).join('')}</div><textarea class="field" id="aimsg" rows="3" placeholder="Converse sobre suas ideias..."></textarea><button class="btn" onclick="askAI($('aimsg').value)">Enviar mensagem →</button><div class="sep"></div><h3>Minha memória</h3><p class="sub">Informações que você escolhe registrar para personalizar suas sugestões.</p><label class="label">Trabalho e estudos</label><textarea class="field" id="routine" rows="2" placeholder="Ex.: Trabalho das 8h às 17h e estudo à noite">${esc(state.routine)}</textarea><label class="label">Meus interesses</label><input class="field" id="interests" value="${esc(state.interests)}" placeholder="Fotografia, trilhas, culinária..."><label class="label">Meu orçamento</label><select class="field" id="budget">${['Não informado','Gratuito','Até R$ 30','Até R$ 100','Flexível'].map(v=>`<option ${state.budget===v?'selected':''}>${v}</option>`).join('')}</select><button class="btn alt" onclick="saveMemory()">Salvar minhas preferências</button></div>`}function saveMemory(){state.routine=$('routine').value;state.interests=$('interests').value;state.budget=$('budget').value;save();toast('Preferências salvas neste aparelho')}function askAI(q){q=q.trim();if(!q)return;state.messages.push({mine:true,text:q});let r=/feriado/i.test(q)?'Que tal separar um dia livre para conhecer um lugar novo, fazer um passeio fotográfico ou reunir amigos para uma experiência diferente?':/amig/i.test(q)?'Que tal um piquenique, uma noite de receitas em grupo ou um desafio de fotos por videochamada?':/gratuit|dinheiro/i.test(q)?'Você pode explorar uma praça nova, fazer um passeio fotográfico ou aprender algo com uma aula gratuita.':'Experimente reservar 15 minutos para uma caminhada diferente, registrar três fotos ou testar uma receita nova.';state.messages.push({mine:false,text:r+' (Sugestão demonstrativa, ainda sem IA real.)'});save();render()}
function profile(){return `<div class="profilehero"></div><div class="section" style="padding-top:0"><img class="profileavatar" src="${pics.portrait}" alt="Avatar ilustrativo"><h1 class="heading" style="margin-top:12px">${esc(state.name)}</h1><p class="sub">Vivendo, aprendendo e experimentando. ✦</p><div class="stats"><div><strong>${state.posts.length}</strong>Publicações</div><div><strong>${state.experiences.length}</strong>Experiências</div><div><strong>0</strong>Amigos</div></div><button class="btn alt" onclick="go('settings')">Editar perfil e preferências</button><div class="tabs"><button class="pill selected">Publicações</button><button class="pill" onclick="go('life')">Minha vida</button><button class="pill" onclick="go('friends')">Amigos</button></div><div class="grid2">${state.posts.filter(p=>p.photo).slice().reverse().map(p=>`<div class="tile"><img src="${p.photo}" alt="Foto publicada"></div>`).join('')||'<div class="blank" style="grid-column:span 2">Suas fotos aparecerão aqui.</div>'}</div><div class="panel"><b>✦ VYVA+</b><p class="sub">Planejamento avançado e memória personalizada — conceito para uma versão futura.</p></div></div>`}
function settings(){return `<div class="section"><h1 class="heading">Configurações</h1><h3>Aparência</h3><p class="sub">Escolha o tema do VYVA.</p><div class="mode">${[['light','Claro'],['dark','Escuro'],['auto','Automático']].map(([v,n])=>`<button class="pill ${state.theme===v?'selected':''}" onclick="state.theme='${v}';save();render()">${n}</button>`).join('')}</div><div class="sep"></div><h3>Meu perfil</h3><label class="label">Nome</label><input class="field" id="newname" value="${esc(state.name)}"><button class="btn alt" onclick="state.name=$('newname').value.trim()||state.name;save();toast('Nome salvo');render()">Salvar nome</button><div class="sep"></div><h3>Privacidade e memória</h3><p class="sub">Nesta demonstração, suas fotos e preferências ficam somente no navegador atual. Não existe login real nem sincronização.</p><button class="btn alt" onclick="if(confirm('Apagar todas as informações desta demonstração?')){localStorage.removeItem(KEY);location.reload()}">Apagar dados locais</button><div class="sep"></div><h3>Sobre o VYVA</h3><p class="sub">Menos vontade guardada. Mais vida acontecendo.</p></div>`}
function notifications(){return `<div class="section"><h1 class="heading">Notificações</h1><div class="panel"><b>Bem-vinda ao VYVA, ${esc(state.name)}!</b><p class="sub">Comece criando sua primeira experiência.</p></div><div class="notice">Curtidas, convites e notificações entre usuários estarão disponíveis após conectar o banco de dados.</div></div>`}function friends(){return `<div class="section"><h1 class="heading">Amigos</h1><p class="sub">Encontre pessoas para viver experiências juntos.</p><div class="notice">Convites e solicitações de amizade precisam de contas reais conectadas ao Supabase.</div><div class="listrow"><img class="thumb" src="${pics.friends}"><div class="info"><b>Experiências compartilhadas</b><p>Convide seus amigos quando a integração estiver ativa.</p></div></div></div>`}function messages(){return `<div class="section"><h1 class="heading">Mensagens</h1><div class="notice">Mensagens privadas serão implementadas com contas reais e proteção de acesso.</div></div>`}render();
</script></body></html>
