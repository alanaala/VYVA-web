const demoPosts=[{id:'d1',demo:true,author:'ana.costa',avatar:pics.portrait,place:'Parque · Natureza',date:'há 2 h',photo:pics.lake,caption:'Hoje resolvi sair sem destino. Às vezes, é disso que a gente precisa. 🌿',likes:324},{id:'d2',demo:true,author:'lucas.ribeiro',avatar:pics.portrait2,place:'Com amigos',date:'ontem',photo:pics.friends,caption:'Uma tarde simples, muitas histórias para lembrar.',likes:186}];function feed(){return `<div class="storyrow">${[['Você',pics.portrait],['Ana',pics.portrait3],['Lucas',pics.portrait2],['Maria',pics.portrait],['Pedro',pics.portrait2]].map(([n,p])=>`<div class="story" onclick="toast('Stories serão adicionados depois')"><img class="avatar" src="${p}">${n}</div>`).join('')}</div>${[...state.posts].reverse().concat(demoPosts).map(postCard).join('')}<p class="mini" style="text-align:center;padding:20px">Prévia: publicações demonstrativas, ainda sem contas conectadas.</p>`}
function like(id){state.likes[id]=!state.likes[id];save();render()}function toggleSaved(id){state.bookmarks[id]=!state.bookmarks[id];save();render();toast(state.bookmarks[id]?'Salvo em sua coleção':'Removido dos salvos')}function saved(){let all=[...state.posts,...demoPosts].filter(p=>state.bookmarks[p.id]);return `<div class="section"><h1 class="heading">Salvos</h1><p class="sub">Suas publicações favoritas ficam aqui neste navegador.</p>${all.length?all.map(postCard).join(''):'<div class="blank">Você ainda não salvou nenhuma publicação.</div>'}</div>`}
function explore(){return `<div class="section vyva-search"><h1 class="heading">Pesquisar</h1><input class="field" id="searchtext" placeholder="Buscar pessoas pelo nome ou @usuário" oninput="filterPeople(this.value)" autocomplete="off" aria-label="Pesquisar pessoas"><div id="search-results" class="search-results"><p class="sub" style="margin-top:22px">Digite um nome ou @usuário para encontrar pessoas.</p></div></div>`}
function filterPeople(value){
 const area=document.getElementById('search-results');if(!area)return;
 const query=(value||'').trim().toLocaleLowerCase('pt-BR').replace(/^@/,'');
 if(!query){area.innerHTML='<p class="sub" style="margin-top:22px">Digite um nome ou @usuário para encontrar pessoas.</p>';return}
 const matches=Object.values(cloud.profiles).filter(p=>!cloud.blocked.includes(p.id)&&p.id!==authUser?.id && [p.display_name||'',p.username||''].some(x=>x.toLocaleLowerCase('pt-BR').includes(query))).slice(0,30);
 area.innerHTML=matches.length?matches.map(p=>`<div class="search-person"><button type="button" class="search-person-open" onclick="openOtherProfile('${p.id}')" aria-label="Abrir perfil"><img src="${esc(avatarUrl(p.avatar_path))}" alt="Foto de perfil"></button><div class="search-person-info" onclick="openOtherProfile('${p.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')openOtherProfile('${p.id}')"><b>${esc(p.display_name||'Usuário VYVA')}</b><small>${p.username?'@'+esc(p.username):'Sem @ definido'}</small></div><button type="button" class="search-follow" onclick="followFromSearch('${p.id}')">${cloud.following.includes(p.id)?'Seguindo':'Seguir'}</button></div>`).join(''):'<p class="sub" style="margin-top:22px">Nenhuma pessoa encontrada.</p>';
}
async function followFromSearch(id){
  const query=document.getElementById('searchtext')?.value||'';
  if(!await changeFollow(id))return;
  const input=document.getElementById('searchtext');
  if(input){input.value=query;filterPeople(query)}
}
function createHub(){return `<div class="section"><h1 class="heading">Criar</h1><p class="sub">Escolha o que deseja compartilhar.</p><div class="create-choices"><button onclick="createType='experiencia';go('create-editor')"><span class="choice-icon">${icon('calendar')}</span><span><b>Experiência</b><small>Registre o que quer viver, está vivendo ou já viveu.</small></span>${icon('chevron')}</button><button onclick="createType='post';go('create-editor')"><span class="choice-icon">${icon('camera')}</span><span><b>Publicação</b><small>Compartilhe uma foto no feed.</small></span>${icon('chevron')}</button><button onclick="createType='instante';go('create-editor')"><span class="choice-icon">${icon('spark')}</span><span><b>Instante</b><small>Um momento que dura 24 horas.</small></span>${icon('chevron')}</button></div></div>`}
function create(){return `<div class="section"><button class="setting-back" onclick="go('create')">${icon('back')} Voltar</button><h1 class="heading">${createType==='experiencia'?'Nova experiência':createType==='post'?'Nova publicação':'Novo Instante'}</h1><p class="notice">${createType==='instante'?'Compartilhe um momento que desaparece do feed após 24 horas.':createType==='experiencia'?'Escolha a etapa da experiência: quero viver, estou vivendo ou já vivi.':'Compartilhe algo que já aconteceu. Sua foto aparecerá no feed e no calendário de memórias.'}</p>${createType==='instante'?`<label class="label">Foto do seu Instante</label><p class="mini">Visível por 24 horas. Uma foto por Instante.</p><div class="photo-choices"><label class="btn alt" for="instante-gallery" style="display:block;text-align:center;cursor:pointer">Escolher da galeria</label><label class="btn alt" for="instante-camera" style="display:block;text-align:center;cursor:pointer">Tirar foto agora</label></div><input class="photo-file" id="instante-gallery" type="file" accept="image/*" onchange="selectInstantePhoto(event)"><input class="photo-file" id="instante-camera" type="file" accept="image/*" capture="environment" onchange="selectInstantePhoto(event)"><div id="instante-preview"></div><label class="label">Legenda (opcional)</label><textarea class="field" id="instante-caption" maxlength="220" rows="2" placeholder="O que está acontecendo?"></textarea><button class="btn" id="instante-publish" onclick="publishInstante()">Publicar Instante →</button>`:createType==='experiencia'?`<label class="label">Nome da experiência</label><input class="field" id="exptitle" placeholder="Ex.: Fazer uma trilha com amigos"><label class="label">Descreva sua ideia</label><textarea class="field" id="expdesc" rows="3" placeholder="O que torna essa experiência especial?"></textarea><label class="label">Etapa da experiência</label><select class="field" id="expstatus"><option value="want">Quero viver</option><option value="doing">Estou vivendo</option><option value="done">Já vivi</option></select><label class="label">Quando?</label><select class="field" id="expwhen"><option>Sem data definida</option><option>Em breve</option><option>Este mês</option><option>Neste ano</option></select><label class="label">Quem pode ver?</label><select class="field" id="expprivacy"><option value="private">Só eu</option><option value="friends">Amigos (em desenvolvimento)</option><option value="public">Público</option></select><div class="notice">Você poderá convidar pessoas quando ativarmos as contas reais e os convites pelo Supabase.</div><button class="btn" onclick="addExperience()">Criar experiência →</button>`:`<label class="label">Compartilhe um momento</label><textarea class="field" id="caption" rows="4" placeholder="O que você viveu hoje?"></textarea><label class="label">Marcar pessoas</label><input class="field" id="tags" placeholder="Digite @ para procurar pessoas" oninput="mentionSuggestions(this.value)" autocomplete="off"><div id="mention-suggestions"></div><label class="label">Música da publicação (referência)</label><input class="field" id="music" placeholder="Nome da música e artista"><p class="mini">A música será exibida como texto. Reprodução e catálogo exigem licenciamento e integração.</p><label class="label">Adicionar foto</label><div class="photo-choices"><label class="btn alt" for="photo-gallery" style="display:block;text-align:center;cursor:pointer">Escolher da galeria</label><label class="btn alt" for="photo-camera" style="display:block;text-align:center;cursor:pointer">Tirar foto agora</label></div><input id="photo-gallery" class="photo-file" type="file" accept="image/*" onchange="loadPhoto(event)"><input id="photo-camera" class="photo-file" type="file" accept="image/*" capture="environment" onchange="loadPhoto(event)"><p class="mini">No computador, a opção de câmera depende do navegador.</p><div id="preview"></div><button class="btn" id="publish-post-btn" onclick="publish()">Publicar no meu feed →</button><p class="mini">As fotos serão enviadas para sua conta VYVA.</p>`}</div>`}
function addExperience(){let title=$('exptitle').value.trim();if(!title)return toast('Escreva o nome da experiência');state.experiences.unshift({id:Date.now(),title,desc:$('expdesc').value.trim(),when:$('expwhen').value,privacy:$('expprivacy').value,status:'Quero viver',created:new Date().toISOString()});save();tab='Quero viver';go('life');toast('Experiência criada!')}
function loadPhoto(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,1000/img.width,1000/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.65);$('preview').innerHTML=`<img class="imgpreview" src="${photo}" alt="Prévia da foto">`};img.src=reader.result};reader.readAsDataURL(f)}
function publish(){let caption=$('caption').value.trim();if(!caption&&!photo)return toast('Adicione uma foto ou legenda');state.posts.push({id:'p'+Date.now(),caption,photo,tags:$('tags')?.value.trim()||'',music:$('music')?.value.trim()||'',created:new Date().toISOString(),date:new Date().toLocaleDateString('pt-BR'),author:state.name,likes:0});save();photo='';go('feed');toast('Publicado neste navegador!')}
function life(){let today=new Date(),m=new Date(today.getFullYear(),today.getMonth()+calendarOffset,1),year=m.getFullYear(),month=m.getMonth(),days=new Date(year,month+1,0).getDate(),start=new Date(year,month,1).getDay();let cells=Array.from({length:start},()=>'<div></div>').join('')+Array.from({length:days},(_,i)=>{let d=i+1,p=state.posts.filter(p=>{let t=new Date(p.created);return t.getFullYear()===year&&t.getMonth()===month&&t.getDate()===d&&p.photo}).at(-1);return `<button class="day ${selectedDay===d?'current':''}" onclick="selectedDay=${d};render()">${p?`<img src="${p.photo}" alt="Memória do dia ${d}"><span>${d}</span>`:d}</button>`}).join('');let matches=state.experiences.filter(x=>x.status===tab);let posts=selectedDay?state.posts.filter(p=>{let t=new Date(p.created);return t.getFullYear()===year&&t.getMonth()===month&&t.getDate()===selectedDay}):[];return `<div class="section"><h1 class="heading">Minha vida</h1><p class="sub">Uma coleção de tudo o que você quer viver e já viveu.</p><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><button class="ico" onclick="calendarOffset--;selectedDay=null;render()">${icon('back')}</button><b>${m.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button class="ico" onclick="calendarOffset++;selectedDay=null;render()">${icon('chevron')}</button></div><div class="cal">${['D','S','T','Q','Q','S','S'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div><p class="mini" style="margin-bottom:0">As fotos aparecem no dia em que você publicou.</p></div>${selectedDay?`<div class="panel"><b>${selectedDay} de ${m.toLocaleDateString('pt-BR',{month:'long'})}</b>${posts.length?posts.map(p=>`<p class="sub">${esc(p.caption||'Foto publicada')}</p>${p.photo?`<img class="cover" src="${p.photo}">`:''}`).join(''):'<p class="sub">Nenhuma publicação neste dia.</p>'}</div>`:''}<h2 style="font-size:19px;margin:25px 0 3px">Minhas experiências</h2><div class="tabs">${['Quero viver','Estou vivendo','Já vivi'].map(t=>`<button class="pill ${tab===t?'selected':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div>${matches.length?matches.map(x=>`<div class="listrow"><div class="round">✦</div><div class="info"><b>${esc(x.title)}</b><p>${esc(x.when)}</p></div><button class="ico" onclick="openExperience(${x.id})">${icon('chevron')}</button></div>`).join(''):'<div class="blank">Suas experiências aparecerão aqui.<br>Que tal criar a primeira?</div>'}<button class="btn alt" onclick="createType='experiencia';go('create-editor')">＋ Criar experiência</button></div>`}
let activeExperience=null;function openExperience(id){activeExperience=id;go('experience')}function experienceDetail(){let x=state.experiences.find(x=>x.id===activeExperience);if(!x)return '<div class="section">Experiência não encontrada.</div>';return `<div class="section"><button class="ico" onclick="go('life')">${icon('back')}</button><div class="feature" style="margin:12px 0"><div><h3>${esc(x.title)}</h3><p>Uma experiência para viver no seu tempo.</p></div></div><h1 class="heading">${esc(x.title)}</h1><p class="sub">${esc(x.desc||'Sua próxima experiência começa com uma ideia.')}</p><div class="panel"><b>Status</b><select class="field" id="newstatus" onchange="changeStatus(${x.id},this.value)">${['Quero viver','Estou vivendo','Já vivi'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><b>Planejamento</b><p class="sub">${esc(x.when)}</p><b>Privacidade</b><p class="sub">${x.privacy==='private'?'Somente você':x.privacy==='friends'?'Amigos (pendente de integração)':'Pública (pendente de integração)'}</p></div><button class="btn" onclick="toast('Convites reais exigem login e banco de dados')">${icon('users')} Convidar amigos</button><button class="btn alt" onclick="deleteExperience(${x.id})">Excluir experiência</button></div>`}function changeStatus(id,status){let x=state.experiences.find(x=>x.id===id);x.status=status;save();toast('Status atualizado')}function deleteExperience(id){if(confirm('Excluir esta experiência?')){state.experiences=state.experiences.filter(x=>x.id!==id);save();go('life')}}
function ai(){return `<div class="chat-shell"><div class="chat-title"><div class="spark">✦</div><div><b>VYVA IA</b><div class="mini">Um espaço para conversar e descobrir possibilidades</div></div></div><div class="chat-messages" id="chatmessages">${state.messages.length?state.messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}</div>`).join(''):`<div class="chat-empty"><div style="font-size:38px">✦</div><h2>O que vamos viver hoje?</h2><p>Converse sobre o que você gostaria de fazer, aprender ou experimentar.</p></div>`}</div>${!state.messages.length?`<div class="quick chat-suggestions">${['Tenho pouco tempo','Quero algo gratuito','Algo com meus amigos'].map(t=>`<button class="pill" onclick="askAI('${t}')">${t}</button>`).join('')}</div>`:''}<form class="chat-compose" onsubmit="event.preventDefault();askAI($('aimsg').value)"><textarea id="aimsg" rows="1" placeholder="Pergunte qualquer coisa..."></textarea><button type="submit" aria-label="Enviar">➤</button></form><p class="mini" style="text-align:center;margin:0 12px 10px">Respostas geradas por IA. Evite compartilhar informações sensíveis.</p></div>`}function saveMemory(){state.routine=$('routine').value;state.interests=$('interests').value;state.budget=$('budget').value;save();toast('Preferências salvas neste aparelho')}function askAI(q){q=q.trim();if(!q)return;state.messages.push({mine:true,text:q});let r=/feriado/i.test(q)?'Podemos pensar em um passeio, um projeto criativo ou uma experiência com amigos. Você prefere sair de casa ou ficar por perto?':/amig/i.test(q)?'Legal! Vocês preferem se encontrar pessoalmente ou fazer algo juntos à distância?':/gratuit|dinheiro/i.test(q)?'Podemos explorar algo gratuito: uma caminhada fotográfica, um novo hobby ou uma atividade criativa. O que combina mais com você?':'Me conta um pouco mais: quanto tempo você tem e prefere fazer algo sozinho ou acompanhado?';state.messages.push({mine:false,text:r});save();render();setTimeout(()=>{let x=$('chatmessages');if(x)x.scrollTop=x.scrollHeight},0)}
function profile(){let posts=state.posts.filter(p=>p.photo).slice().reverse();return `<div class="profile-screen"><div class="profile-top"><b class="profile-handle">${esc(state.name)}</b><button class="ico profile-menu" onclick="go('settings')" aria-label="Abrir menu e configurações">${icon('menu')}</button></div><div class="profile-summary"><img class="profile-avatar-new" src="${pics.portrait}" alt="Foto do perfil"><div class="profile-numbers"><div><strong>${state.posts.length}</strong><span>publicações</span></div><div><strong>${state.experiences.length}</strong><span>experiências</span></div><div><strong>0</strong><span>amigos</span></div></div></div><div class="profile-bio"><b>${esc(state.name)}</b><p>Vivendo, aprendendo e experimentando.</p></div><div class="profile-actions"><button onclick="openSetting('edit-profile')">Editar perfil</button><button onclick="go('friends')">Amigos</button></div><div class="profile-tabline"><span>${icon('camera')} Publicações</span></div><div class="profile-grid">${posts.map(p=>`<div class="profile-tile"><img src="${p.photo}" alt="Foto publicada"></div>`).join('')||'<div class="profile-empty">Quando você publicar fotos, elas aparecerão aqui.</div>'}</div></div>`}
function settings(){return `<div class="settings-screen"><div class="settings-top"><button class="ico" onclick="go('profile')" aria-label="Voltar ao perfil">${icon('back')}</button><h1>Configurações</h1><span></span></div><div class="settings-group"><h2>Conta e conteúdo</h2><button class="setting-row" onclick="openSetting('edit-profile')">${icon('user')}<span>Editar perfil</span>${icon('chevron')}</button><button class="setting-row" onclick="go('saved')">${icon('bookmark')}<span>Itens salvos</span>${icon('chevron')}</button></div><div class="settings-group"><h2>Preferências</h2><button class="setting-row" onclick="openSetting('appearance')">${icon('moon')}<span>Aparência</span>${icon('chevron')}</button><button class="setting-row" onclick="openSetting('ai-memory')">${icon('spark')}<span>VYVA IA e memória</span>${icon('chevron')}</button></div><div class="settings-group"><h2>Privacidade e dados</h2><button class="setting-row" onclick="openSetting('privacy')">${icon('settings')}<span>Privacidade e dados locais</span>${icon('chevron')}</button></div><div class="settings-group"><button class="setting-row" onclick="logout()">${icon('back')}<span>Sair da conta</span>${icon('chevron')}</button></div><div class="settings-group"><h2>Sobre</h2><div class="setting-row static">${icon('heart')}<span>VYVA — Menos vontade guardada. Mais vida acontecendo.</span></div></div></div>`}
function openSetting(section){let content='';if(section==='appearance')content=`<h2>Aparência</h2><p class="sub">Escolha como o VYVA aparece no seu celular.</p><div class="mode">${[['light','Claro'],['dark','Escuro'],['auto','Automático']].map(([v,n])=>`<button class="pill ${state.theme===v?'selected':''}" onclick="state.theme='${v}';save();render()">${n}</button>`).join('')}</div>`;if(section==='ai-memory')content=`<h2>VYVA IA e memória</h2><p class="sub">Suas preferências serão vinculadas à sua conta.</p><label class="label">Trabalho e estudos</label><textarea class="field" id="routine" rows="2" placeholder="Ex.: Trabalho de dia e estudo à noite">${esc(state.routine)}</textarea><label class="label">Interesses</label><input class="field" id="interests" value="${esc(state.interests)}"><label class="label">Orçamento</label><select class="field" id="budget">${['Não informado','Gratuito','Até R$ 30','Até R$ 100','Flexível'].map(v=>`<option ${state.budget===v?'selected':''}>${v}</option>`).join('')}</select><button class="btn" onclick="saveMemory()">Salvar preferências</button>`;if(section==='edit-profile')content=`<h2>Editar perfil</h2><label class="label">Nome</label><input class="field" id="newname" value="${esc(state.name)}"><button class="btn" onclick="state.name=$('newname').value.trim()||state.name;save();toast('Nome salvo');go('profile')">Salvar alterações</button>`;if(section==='privacy')content=`<h2>Privacidade e dados locais</h2><p class="sub">Você está conectado à sua conta. Apagar dados locais não apaga informações armazenadas no Supabase.</p><button class="btn alt" onclick="if(confirm('Apagar todos os dados desta demonstração?')){localStorage.removeItem(KEY);location.reload()}">Apagar dados locais</button>`;document.querySelector('main').innerHTML=`<div class="section"><button class="setting-back" onclick="go('settings')">${icon('back')} Configurações</button><div class="settings-detail">${content}</div></div>`}

const cloud = {blocked:[],muted:[],instantes:[],posts:[],experiences:[],likes:{},saved:{},comments:{},profiles:{},following:[],publicExperiences:[],socialFollows:[],ready:false};
const cloudDate = iso => new Date(iso).toLocaleDateString('pt-BR');
const cloudError = error => {console.error('VYVA Supabase:',error);toast('Erro: '+(error?.message||'tente novamente'));};
const profileName = id => cloud.profiles[id]?.display_name || 'Usuário VYVA';
const photoUrl = path => path ? sb.storage.from('vyva-posts').getPublicUrl(path).data.publicUrl : '';
async function loadCloud(){
  if(!sb || !authUser)return;
  const uid=authUser.id;
  const results=await Promise.all([
    sb.from('posts').select('id,author_id,caption,image_path,music_title,visibility,created_at').order('created_at',{ascending:false}).limit(100),
    sb.from('experiences').select('id,creator_id,title,description,status,visibility,planned_for,created_at').eq('creator_id',uid).order('created_at',{ascending:false}),
    sb.from('post_likes').select('post_id,user_id'),
    sb.from('saved_posts').select('post_id').eq('user_id',uid),
    sb.from('comments').select('id,post_id,author_id,body,created_at').order('created_at',{ascending:true}).limit(500),

  ]);
  const labels=['posts','experiences','post_likes','saved_posts','comments','profiles','follows','instantes','publicExperiences','socialFollows','user_blocks','user_mutes'];
  results.forEach((r,i)=>{if(r.error)console.warn('Falha ao carregar '+labels[i],r.error)});

  render();

async function uploadAvatar(event){
  const input=event.target, file=input.files?.[0];
  if(!file||!authUser||!sb)return;
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Use JPG, PNG ou WebP');return}
  if(file.size>5*1024*1024){toast('A foto deve ter até 5 MB');return}
  const btn=document.querySelector('.avatar-editor button');
  if(btn){btn.disabled=true;btn.textContent='Enviando...'}
  let path=null;
  try{
    const image=await createImageBitmap(file);
    const canvas=document.createElement('canvas');
    const size=512;canvas.width=size;canvas.height=size;
    const ctx=canvas.getContext('2d');
    const crop=Math.min(image.width,image.height);
    ctx.drawImage(image,(image.width-crop)/2,(image.height-crop)/2,crop,crop,0,0,size,size);
    image.close();
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.85));
    if(!blob)throw new Error('Não foi possível preparar a imagem');
    path=`${authUser.id}/avatar-${crypto.randomUUID()}.jpg`;
    const uploaded=await sb.storage.from('vyva-posts').upload(path,blob,{contentType:'image/jpeg',upsert:false});
    if(uploaded.error)throw uploaded.error;
    const updated=await sb.from('profiles').update({avatar_path:path}).eq('id',authUser.id).select('id');
    if(updated.error)throw updated.error;
    if(!updated.data?.length)throw new Error('Não foi possível atualizar o perfil. Verifique as permissões.');
    await loadCloud();
    openSetting('edit-profile');
    toast('Foto de perfil atualizada!');
  }catch(error){
    if(path)await sb.storage.from('vyva-posts').remove([path]);
    cloudError(error);
  }finally{if(btn?.isConnected){btn.disabled=false;btn.textContent='Alterar foto'}input.value=''}
}

const followBusy=new Set();
async function changeFollow(id){
  if(!sb||!authUser||!id||id===authUser.id||followBusy.has(id))return false;
  followBusy.add(id);
  const wasFollowing=cloud.following.includes(id);
  try{
    let result;
    if(wasFollowing){
      result=await sb.from('follows').delete()
        .eq('follower_id',authUser.id).eq('following_id',id)
        .select('follower_id,following_id');
    }else{
      result=await sb.from('follows').upsert(
        {follower_id:authUser.id,following_id:id},
        {onConflict:'follower_id,following_id',ignoreDuplicates:true}
      );
    }
    if(result.error)throw result.error;
    await loadCloud();
    if(wasFollowing&&cloud.following.includes(id)){
      toast('Não foi possível deixar de seguir. Verifique as permissões.');
      return false;
    }
    return true;
  }catch(error){
    cloudError(error);
    return false;
  }finally{
    followBusy.delete(id);
  }
}

async function publishInstante(){
 if(!authUser||!sb)return toast('Entre na sua conta primeiro');

function mentionSuggestions(value){const box=$('mention-suggestions');if(!box)return;const m=String(value).match(/(?:^|\s)@([a-z0-9_]*)$/i);if(!m){box.innerHTML='';return}const q=m[1].toLowerCase();const found=Object.values(cloud.profiles).filter(p=>p.id!==authUser?.id&&!cloud.blocked.includes(p.id)&&p.username&&p.username.toLowerCase().includes(q)).slice(0,6);box.innerHTML=found.map(p=>`<button class="setting-row" type="button" onclick="insertMention('${esc(p.username)}')"><img src="${esc(avatarUrl(p.avatar_path))}" style="width:32px;height:32px;border-radius:50%;object-fit:cover"><span>@${esc(p.username)} · ${esc(p.display_name||'')}</span></button>`).join('')}

const social={likes:[],comments:[],requests:[],messages:[],notifications:[],reposts:[],chatWith:null,openExperience:null};
const oldLoadCloud=loadCloud;
loadCloud=async function(){
 await oldLoadCloud();
 if(!authUser)return;
 const uid=authUser.id;
 const requests=[
  sb.from('experience_likes').select('experience_id,user_id'),
  sb.from('experience_comments').select('id,experience_id,author_id,body,created_at').order('created_at',{ascending:true}).limit(500),
  sb.from('experience_requests').select('id,experience_id,requester_id,status,created_at').limit(500),
  sb.from('direct_messages').select('id,sender_id,recipient_id,body,created_at').or(`sender_id.eq.${uid},recipient_id.eq.${uid}`).order('created_at',{ascending:true}).limit(500),
  sb.from('vyva_notifications').select('id,actor_id,kind,reference_id,body,read_at,created_at').eq('recipient_id',uid).order('created_at',{ascending:false}).limit(100),
  sb.from('post_reposts').select('post_id,user_id,created_at').order('created_at',{ascending:false}).limit(200)
 ];
 const r=await Promise.all(requests);
 ['likes','comments','requests','messages','notifications','reposts'].forEach((key,i)=>{if(r[i].error)console.warn('VYVA '+key,r[i].error);social[key]=r[i].data||[]});
 if(page==='feed'||page==='messages'||page==='notifications'||page==='experience-social')render();
};

 return `<div class="section"><button class="setting-back" onclick="go('feed')">${icon('back')} Voltar</button><h1 class="heading">Mensagens</h1>${selected?`<button class="pill" onclick="social.chatWith=null;render()">← Conversas</button><h3>${esc(profileName(selected))}</h3><div class="chat-messages" style="min-height:200px;max-height:55dvh">${thread.map(m=>`<div class="bubble ${m.sender_id===authUser?.id?'mine':''}">${esc(m.body)}</div>`).join('')||'<p class="sub">Comece a conversa.</p>'}</div><form class="comment-form" onsubmit="sendDM(event)"><input class="field" name="body" maxlength="2000" placeholder="Mensagem" required><button>Enviar</button></form>`:`<h3>Conversas</h3>${peers.map(id=>`<button class="setting-row" onclick="social.chatWith='${id}';render()">${icon('user')}<span>${esc(profileName(id))}</span>${icon('chevron')}</button>`).join('')||'<p class="sub">Nenhuma conversa ainda. Abra o perfil de alguém para começar.</p>'}`}</div>`;
}
function startChat(id){if(cloud.blocked.includes(id))return toast('Usuário bloqueado');social.chatWith=id;go('messages')}
async function sendDM(event){event.preventDefault();const form=event.target,body=form.elements.body.value.trim();if(!body||!social.chatWith)return;const {error}=await sb.from('direct_messages').insert({sender_id:authUser.id,recipient_id:social.chatWith,body});if(error)return cloudError(error);await loadCloud();form.reset()}
function notifications(){
 return `<div class="section"><h1 class="heading">Notificações</h1>${social.notifications.map(n=>`<button class="setting-row" onclick="readNotice('${n.id}')">${icon('bell')}<span><b>${esc(profileName(n.actor_id))}</b> ${esc(n.body||n.kind)}<small style="display:block">${cloudDate(n.created_at)}</small></span>${!n.read_at?'●':''}</button>`).join('')||'<p class="sub">Ainda não há notificações.</p>'}</div>`;
}
async function readNotice(id){await sb.from('vyva_notifications').update({read_at:new Date().toISOString()}).eq('id',id);await loadCloud()}
const oldRender=render;
render=function(){oldRender();if(page==='experience-social')$('main').innerHTML=experienceSocial()};

/* VYVA: edição de experiências, links compartilháveis e pesquisa no chat */
function editExperience(id){
 const x=cloud.experiences.find(v=>v.id===id&&v.creator_id===authUser?.id);if(!x)return;
 const overlay=document.createElement('div');overlay.id='experience-edit-overlay';overlay.className='post-options-overlay';
 overlay.innerHTML=`<form class="post-options-dialog" style="max-height:90dvh;overflow:auto" onsubmit="saveExperienceEdit(event,'${id}')"><h3>Editar experiência</h3><label class="label">Título</label><input class="field" name="title" maxlength="140" required value="${esc(x.title)}"><label class="label">Descrição</label><textarea class="field" name="description" maxlength="2000" rows="4">${esc(x.description||'')}</textarea><label class="label">Etapa</label><select class="field" name="status">${Object.entries(statusToDB).map(([label,v])=>`<option value="${v}" ${x.status===v?'selected':''}>${label}</option>`).join('')}</select><label class="label">Privacidade</label><select class="field" name="visibility"><option value="private" ${x.visibility==='private'?'selected':''}>Só eu</option><option value="public" ${x.visibility==='public'?'selected':''}>Público</option></select><button type="submit" class="btn">Salvar alterações</button><button type="button" class="btn alt" onclick="document.getElementById('experience-edit-overlay')?.remove()">Cancelar</button></form>`;
 overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});document.body.append(overlay);
}
async function saveExperienceEdit(event,id){
 event.preventDefault();const form=event.target,button=form.querySelector('[type=submit]');button.disabled=true;
 const title=form.elements.title.value.trim(),description=form.elements.description.value.trim(),status=form.elements.status.value,visibility=form.elements.visibility.value;
 if(!title){button.disabled=false;return toast('Informe um título')}
 const {error}=await sb.from('experiences').update({title,description,status,visibility}).eq('id',id).eq('creator_id',authUser.id);
 button.disabled=false;if(error)return cloudError(error);document.getElementById('experience-edit-overlay')?.remove();await loadCloud();toast('Experiência atualizada');
}
function openSharedLink(){
 const hash=location.hash;
 if(hash.startsWith('#experience-')){
  const id=hash.slice('#experience-'.length);
  if([...cloud.experiences,...cloud.publicExperiences].some(v=>v.id===id)){social.openExperience=id;page='experience-social';history.replaceState(null,'',location.pathname);render()}
 }
}
const loadWithSharedLinks=loadCloud;
loadCloud=async function(){await loadWithSharedLinks();if(authUser)openSharedLink()};
function searchChatPeople(value){
 const area=document.getElementById('chat-person-results');if(!area)return;
 const q=String(value||'').trim().toLowerCase().replace(/^@/,'');if(!q){area.innerHTML='';return}
 area.innerHTML=Object.values(cloud.profiles).filter(p=>p.id!==authUser?.id&&!cloud.blocked.includes(p.id)&&[p.display_name||'',p.username||''].some(v=>v.toLowerCase().includes(q))).slice(0,12).map(p=>`<button class="setting-row" onclick="startChat('${p.id}')"><img src="${esc(avatarUrl(p.avatar_path))}" style="width:36px;height:36px;border-radius:50%;object-fit:cover"><span>${esc(p.display_name||p.username||'Usuário')}<small style="display:block">@${esc(p.username||'')}</small></span>${icon('chevron')}</button>`).join('')||'<p class="sub">Nenhuma pessoa encontrada.</p>';
}
const originalMessages=messages;
messages=function(){const html=originalMessages();if(social.chatWith)return html;return html.replace('<h3>Conversas</h3>','<h3>Conversas</h3><input class="field" placeholder="Buscar pessoa para conversar" oninput="searchChatPeople(this.value)"><div id="chat-person-results"></div>')};

/* VYVA 3.0: respostas, compartilhamento no chat, marcações e leitura */
let sharedPostForChat=null;
function renderMentioned(text){
 const safe=esc(text||'');return safe.replace(/(^|\s)@([a-z0-9_]{3,24})\b/gi,(all,space,name)=>{const p=Object.values(cloud.profiles).find(v=>v.username?.toLowerCase()===name.toLowerCase());return p&&!cloud.blocked.includes(p.id)?`${space}<button class="mention-link" onclick="openOtherProfile('${p.id}')">@${esc(name)}</button>`:all});
}
function replyToInstante(){
 const x=cloud.instantes.find(v=>v.id===viewingInstanteId);if(!x||x.author_id===authUser?.id)return;
 if(cloud.blocked.includes(x.author_id))return toast('Não é possível responder');
 social.chatWith=x.author_id;go('messages');
 const input=document.querySelector('.comment-form input[name="body"]');if(input){input.value='Respondendo ao Instante: ';input.focus()}
}
const baseInstanteViewer=instanteViewer;
instanteViewer=function(){let html=baseInstanteViewer();const x=cloud.instantes.find(v=>v.id===viewingInstanteId);if(!x)return html;
 if(x.author_id!==authUser?.id)html=html.replace('<div class="instante-bottom">','<div style="padding:8px 16px"><button class="btn alt" onclick="replyToInstante()">Responder por mensagem</button></div><div class="instante-bottom">');
 return html.replace(`<div class="instante-caption">${esc(x.caption)}</div>`,`<div class="instante-caption">${renderMentioned(x.caption)}</div>`);
};
function sharePostToChat(id){sharedPostForChat=id;social.chatWith=null;go('messages');toast('Selecione uma conversa para enviar a publicação')}
const messagesBeforeShare=messages;
messages=function(){let html=messagesBeforeShare();if(sharedPostForChat){
 if(social.chatWith)html=html.replace('</h3><div class="chat-messages"',`</h3><div style="padding:8px"><button class="btn alt" onclick="sendSharedPost()">Enviar publicação nesta conversa</button><button class="pill" onclick="sharedPostForChat=null;render()">Cancelar</button></div><div class="chat-messages"`);
 else html=html.replace('<h1 class="heading">Mensagens</h1>','<h1 class="heading">Compartilhar publicação</h1><p class="sub">Escolha uma pessoa ou conversa para enviar.</p>');
 }return html;
};
async function sendSharedPost(){if(!social.chatWith||!sharedPostForChat)return;const id=sharedPostForChat;const url=location.origin+location.pathname+'#post-'+id;const {error}=await sb.from('direct_messages').insert({sender_id:authUser.id,recipient_id:social.chatWith,body:'Compartilhou uma publicação: '+url});if(error)return cloudError(error);sharedPostForChat=null;await loadCloud();toast('Publicação enviada')}
const priorPostCard=postCard;
postCard=function(p){let html=priorPostCard(p);const anchor=`<button class="ico" onclick="sharePost('${p.id}')" aria-label="Compartilhar">${icon('send')}</button>`;
 if(html.includes(anchor))html=html.replace(anchor,anchor+`<button class="ico" onclick="sharePostToChat('${p.id}')" aria-label="Enviar no chat">${icon('message')}</button>`);
 return html.replace(`${esc(p.caption)}`,`${renderMentioned(p.caption)}`);
};
const beforeMessagesReload=loadCloud;
loadCloud=async function(){await beforeMessagesReload();if(!authUser)return;
 const unread=social.messages.filter(m=>m.recipient_id===authUser.id&&!m.read_at).length;
 const headerBell=document.querySelector('header .actions button[aria-label="Mensagens"]');if(headerBell)headerBell.title=unread?`${unread} mensagens não lidas`:'Mensagens';
};
const oldStartChat=startChat;
startChat=function(id){oldStartChat(id);markThreadRead(id)};
async function markThreadRead(id){if(!id||!authUser)return;await sb.from('direct_messages').update({read_at:new Date().toISOString()}).eq('recipient_id',authUser.id).eq('sender_id',id).is('read_at',null)}
const oldRenderChat=render;
render=function(){oldRenderChat();if(page==='messages'&&social.chatWith)markThreadRead(social.chatWith)};
const oldExperienceCard=experienceCard;
experienceCard=function(x){return oldExperienceCard(x).replace(`${esc(x.description||'')}`,`${renderMentioned(x.description||'')}`)};
function reportProfile(id){
 document.getElementById('safety-overlay')?.remove();
 const overlay=document.createElement('div');overlay.className='post-options-overlay';overlay.id='report-overlay';overlay.innerHTML=`<form class="post-options-dialog" onsubmit="submitProfileReport(event,'${id}')"><h3>Denunciar perfil</h3><select class="field" name="reason" required><option value="spam">Spam</option><option value="harassment">Assédio</option><option value="impersonation">Perfil falso</option><option value="inappropriate">Conteúdo inadequado</option><option value="other">Outro</option></select><textarea class="field" name="details" maxlength="1000" placeholder="Detalhes (opcional)"></textarea><button class="btn" type="submit">Enviar denúncia</button><button type="button" class="btn alt" onclick="document.getElementById('report-overlay')?.remove()">Cancelar</button></form>`;overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};document.body.append(overlay)
}
async function submitProfileReport(event,id){event.preventDefault();const f=event.target;const {error}=await sb.from('user_reports').insert({reporter_id:authUser.id,reported_id:id,reason:f.elements.reason.value,details:f.elements.details.value.trim()});if(error)return cloudError(error);document.getElementById('report-overlay')?.remove();toast('Denúncia enviada para análise')}
const originalSafetyMenu=profileSafetyMenu;
profileSafetyMenu=function(id){originalSafetyMenu(id);const el=document.getElementById('safety-overlay');if(el)el.innerHTML=el.innerHTML.replace(`document.getElementById('safety-overlay')?.remove();toast('Denúncias: recurso em preparação')`,`reportProfile('${id}')`)};

/* Feedback VYVA: modo consciente opcional, seguidores, instantes e uploads */
const mindful={enabled:false,morningStart:7,morningEnd:9,eveningStart:19,eveningEnd:22,storyLikes:[],loading:false};
function mindfulOpen(){const h=new Date().getHours();return !mindful.enabled||(h>=mindful.morningStart&&h<mindful.morningEnd)||(h>=mindful.eveningStart&&h<mindful.eveningEnd)}
function mindfulGate(){return `<div class="section" style="text-align:center;padding:55px 22px"><h1 class="heading">Viva agora. Compartilhe depois.</h1><p class="sub">Seu feed abre das 07h às 09h e das 19h às 22h. Você ainda pode publicar, conversar e registrar experiências.</p><p class="notice">Próxima abertura: ${new Date().getHours()<7?'07h':new Date().getHours()<19?'19h':'07h de amanhã'}</p><button class="btn" onclick="createType='post';go('create-editor')">Registrar meu dia</button><button class="btn alt" onclick="go('settings');openSetting('modo-vyva')">Configurar Modo VYVA</button></div>`}
const mindfulFeed=feed;
feed=function(){return mindfulOpen()?mindfulFeed():mindfulGate()};
const mindfulLoad=loadCloud;
loadCloud=async function(){await mindfulLoad();if(!authUser)return;
 const [pref,likes]=await Promise.all([sb.from('vyva_mindful_settings').select('enabled').eq('user_id',authUser.id).maybeSingle(),sb.from('instante_likes').select('instante_id,user_id').limit(1000)]);
 if(!pref.error)mindful.enabled=!!pref.data?.enabled;
 if(!likes.error)mindful.storyLikes=likes.data||[];
 if(['feed','instante-view','profile','other-profile'].includes(page))render();
};
async function setMindfulMode(value){if(!authUser)return;const {error}=await sb.from('vyva_mindful_settings').upsert({user_id:authUser.id,enabled:!!value},{onConflict:'user_id'});if(error)return cloudError(error);mindful.enabled=!!value;toast(value?'Modo VYVA ativado':'Modo VYVA desativado');openSetting('modo-vyva')}
const mindfulSettings=settings;
settings=function(){return mindfulSettings().replace('<h2>Preferências</h2>','<h2>Preferências</h2><button class="setting-row" onclick="openSetting(\'modo-vyva\')">'+icon('moon')+'<span>Modo VYVA · uso consciente</span>'+icon('chevron')+'</button>')};
const mindfulOpenSetting=openSetting;
openSetting=function(section){if(section!=='modo-vyva')return mindfulOpenSetting(section);document.querySelector('main').innerHTML=`<div class="section"><button class="setting-back" onclick="go('settings')">← Configurações</button><h2>Modo VYVA</h2><p class="sub">Viva agora. Compartilhe depois. Quando ativado, o feed fica disponível das 07h às 09h e das 19h às 22h, no horário do seu dispositivo. Publicações, mensagens e experiências continuam disponíveis.</p><button class="btn" onclick="setMindfulMode(${!mindful.enabled})">${mindful.enabled?'Desativar Modo VYVA':'Ativar Modo VYVA'}</button><p class="mini">O modo é opcional e pode ser desligado quando quiser.</p></div>`};
let followerView=null;
function showFollowerList(id,type){followerView={id,type};go('followers-list')}
function followerList(){if(!followerView)return '<div class="section">Lista indisponível.</div>';const {id,type}=followerView;const users=cloud.socialFollows.filter(f=>type==='followers'?f.following_id===id:f.follower_id===id).map(f=>type==='followers'?f.follower_id:f.following_id).filter(uid=>!cloud.blocked.includes(uid));return `<div class="section"><button class="setting-back" onclick="openOtherProfile('${id}')">← Voltar</button><h1 class="heading">${type==='followers'?'Seguidores':'Seguindo'}</h1>${users.map(uid=>`<button class="setting-row" onclick="openOtherProfile('${uid}')"><img src="${esc(avatarUrl(cloud.profiles[uid]?.avatar_path))}" style="width:42px;height:42px;border-radius:50%;object-fit:cover"><span>${esc(profileName(uid))}<small style="display:block">@${esc(cloud.profiles[uid]?.username||'')}</small></span>→</button>`).join('')||'<p class="sub">Nenhuma pessoa nesta lista.</p>'}</div>`}
const followerProfile=profile;
profile=function(){const html=followerProfile(),uid=authUser?.id,followers=cloud.socialFollows.filter(f=>f.following_id===uid).length;return html.replace(`<strong>${cloud.following.length}</strong><span>seguindo</span>`,`<strong>${followers}</strong><span>seguidores</span></div><div onclick="showFollowerList('${uid}','following')" style="cursor:pointer"><strong>${cloud.following.length}</strong><span>seguindo</span>`).replace(`<strong>${followers}</strong><span>seguidores</span>`,`<strong>${followers}</strong><span onclick="showFollowerList('${uid}','followers')" style="cursor:pointer">seguidores</span>`)};
const followerOther=otherProfile;
otherProfile=function(){let html=followerOther(),id=selectedProfileId;return html.replace('<span>seguidores</span>',`<span onclick="showFollowerList('${id}','followers')" style="cursor:pointer">seguidores</span>`).replace('<span>seguindo</span>',`<span onclick="showFollowerList('${id}','following')" style="cursor:pointer">seguindo</span>`)};
const followerRender=render;
render=function(){followerRender();if(page==='followers-list'){$('header').style.display='none';$('main').innerHTML=followerList()}if(page==='feed'&&!mindfulOpen()){$('main').innerHTML=mindfulGate()}};
async function likeInstante(id){if(!authUser)return;const liked=mindful.storyLikes.some(x=>x.instante_id===id&&x.user_id===authUser.id),q=sb.from('instante_likes');const {error}=liked?await q.delete().eq('instante_id',id).eq('user_id',authUser.id):await q.insert({instante_id:id,user_id:authUser.id});if(error)return cloudError(error);await loadCloud()}
const likesViewer=instanteViewer;
instanteViewer=function(){let html=likesViewer();const x=cloud.instantes.find(v=>v.id===viewingInstanteId);if(!x)return html;const count=mindful.storyLikes.filter(v=>v.instante_id===x.id).length,liked=mindful.storyLikes.some(v=>v.instante_id===x.id&&v.user_id===authUser?.id);return html.replace('<div class="instante-bottom">',`<div style="display:flex;align-items:center;justify-content:center;gap:12px;padding:8px"><button class="pill" onclick="likeInstante('${x.id}')">${liked?'♥':'♡'} ${count} curtida${count===1?'':'s'}</button></div><div class="instante-bottom">`)};
async function compressVYVAPhoto(file){if(!file||file.size<=4.5*1024*1024)return file;if(!file.type.startsWith('image/'))throw Error('Selecione uma imagem');const bmp=await createImageBitmap(file),scale=Math.min(1,2048/Math.max(bmp.width,bmp.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bmp.width*scale);canvas.height=Math.round(bmp.height*scale);canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close?.();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.82));if(!blob)throw Error('Não foi possível comprimir a imagem');if(blob.size>5*1024*1024)throw Error('Imagem muito grande mesmo após compressão');return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'})}
loadPhoto=async function(event){const file=event.target.files?.[0];if(!file)return;try{selectedFile=await compressVYVAPhoto(file);const reader=new FileReader();reader.onload=()=>{const preview=$('preview');if(preview)preview.innerHTML=`<img class="imgpreview" src="${reader.result}" alt="Prévia da foto">`};reader.readAsDataURL(selectedFile)}catch(e){selectedFile=null;toast(e.message||'Não foi possível preparar a foto')}};
selectInstantePhoto=async function(event){const file=event.target.files?.[0];if(!file)return;try{instanteFile=await compressVYVAPhoto(file);const preview=$('instante-preview');if(preview){const url=URL.createObjectURL(instanteFile);preview.innerHTML=`<img src="${url}" alt="Prévia do Instante">`;preview.querySelector('img').onload=()=>URL.revokeObjectURL(url)}}catch(e){instanteFile=null;toast(e.message||'Não foi possível preparar a foto')}};
/* Atualização automática quando o app volta ao primeiro plano */
let lastForegroundRefresh=0;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&authUser&&Date.now()-lastForegroundRefresh>45000){lastForegroundRefresh=Date.now();loadCloud()}});

// VYVA IA real: a chave do provedor permanece no Supabase Edge Functions.
let vyvaAiBusy=false;
async function askAI(question){
 const q=String(question||'').trim();
 if(!q||vyvaAiBusy)return;
 if(!sb||!authUser){toast('Entre na sua conta para conversar com a IA');return}
 vyvaAiBusy=true;
 state.messages.push({mine:true,text:q});save();render();
 try{
  const {data,error}=await sb.functions.invoke('vyva-ai',{
   body:{messages:state.messages.slice(-16).map(m=>({role:m.mine?'user':'assistant',content:String(m.text).slice(0,3000)})),preferences:{routine:String(state.routine||'').slice(0,400),interests:String(state.interests||'').slice(0,400),budget:String(state.budget||'').slice(0,100)}}
  });
  if(error)throw error;
  if(!data||typeof data.reply!=='string'||!data.reply.trim())throw Error('Resposta inválida da IA');
  state.messages.push({mine:false,text:data.reply.trim()});save();
 }catch(err){console.error('VYVA IA:',err);state.messages.push({mine:false,text:'Não consegui me conectar à IA agora. Verifique se a função vyva-ai está publicada e se a chave OPENAI_API_KEY foi configurada no Supabase.'});save()}
 finally{vyvaAiBusy=false;if(page==='ai')render();requestAnimationFrame(()=>{const el=$('chatmessages');if(el)el.scrollTop=el.scrollHeight})}
}
</script></body></html>
