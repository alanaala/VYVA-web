<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>VYVA</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light;--bg:#fff;--fg:#080808;--card:#f3f3f3;--line:#ddd}body.dark{color-scheme:dark;--bg:#080808;--fg:#fff;--card:#1d1d1d;--line:#444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}main{max-width:560px;margin:auto;padding:20px 18px 90px}header,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}header{padding:12px 0 22px}h1{font-size:29px;letter-spacing:3px;margin:0}h2{font-size:22px}p{line-height:1.5}.muted{opacity:.65;font-size:13px}.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:var(--fg);color:var(--bg);border-radius:12px;padding:12px;cursor:pointer}button.secondary{background:var(--card);color:var(--fg)}input,textarea,select{display:block;width:100%;padding:13px;margin:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--bg);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}nav button{font-size:12px;border:0;background:transparent;color:var(--fg);padding:10px;flex:1;max-width:110px}.hide{display:none}.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{aspect-ratio:1;padding:2px;font-size:12px;background:var(--card);color:var(--fg);border:0;border-radius:8px;overflow:hidden}.day img{width:100%;height:65%;object-fit:cover;border-radius:5px}.photo{width:100%;max-height:340px;object-fit:cover;border-radius:12px}.tag{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:5px 9px;font-size:12px}.empty{opacity:.65;text-align:center;padding:30px 8px}</style></head><body><main><header><h1>VYVA</h1><button class="secondary" onclick="toggleTheme()" aria-label="Alternar tema">◐</button></header><div id="content"></div></main><nav id="nav"><button onclick="page='feed';render()">⌂<br>Início</button><button onclick="page='create';render()">＋<br>Criar</button><button onclick="page='calendar';render()">▦<br>Minha vida</button><button onclick="page='ai';render()">✧<br>IA</button><button onclick="page='profile';render()">◯<br>Perfil</button></nav><script>
const KEY='vyva_demo_v1';let state=JSON.parse(localStorage.getItem(KEY)||'{"name":"","routine":"","interests":"","posts":[],"experiences":[],"theme":"light"}');let page=state.name?'feed':'welcome';let photo='';const el=document.getElementById('content');const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';save();render()}function render(){document.body.classList.toggle('dark',state.theme==='dark');document.getElementById('nav').style.display=page==='welcome'?'none':'flex';let html='';if(page==='welcome')html='<h2>Menos vontade guardada.<br>Mais vida acontecendo.</h2><p>Descubra, crie e registre experiências.</p><input id="name" placeholder="Como quer ser chamado(a)?"><button onclick="start()">Começar</button><p class="muted">Prévia local: não cria uma conta online.</p>';if(page==='feed')html='<h2>Início</h2><div class="card"><b>O que você quer viver hoje?</b><p class="muted">Crie experiências e registre seus momentos.</p><button onclick="page=\'create\';render()">＋ Criar</button></div>'+([...state.posts].reverse().map(p=>`<div class="card"><b>${safe(state.name)}</b><p class="muted">${safe(p.date)}</p>${p.photo?`<img class="photo" src="${p.photo}" alt="Foto da publicação">`:''}<p>${safe(p.caption)}</p></div>`).join('')||'<p class="empty">Seu feed começa com sua primeira publicação.</p>');if(page==='create')html='<h2>Criar</h2><div class="card"><h3>Publicação</h3><textarea id="caption" placeholder="Conte seu momento"></textarea><input type="file" accept="image/*" onchange="loadPhoto(event)"><button onclick="post()">Publicar</button></div><div class="card"><h3>Nova experiência</h3><input id="exp" placeholder="O que você quer viver?"><select id="visibility"><option value="private">Só eu</option><option value="friends">Amigos (futuro)</option></select><button onclick="addExp()">Salvar experiência</button></div>';if(page==='calendar'){let now=new Date(),year=now.getFullYear(),month=now.getMonth(),days=new Date(year,month+1,0).getDate(),offset=new Date(year,month,1).getDay();html='<h2>Minha vida</h2><p>'+now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'</p><div class="daygrid">'+['D','S','T','Q','Q','S','S'].map(d=>`<b style="text-align:center">${d}</b>`).join('')+Array.from({length:offset},()=>'<span></span>').join('')+Array.from({length:days},(_,i)=>{let d=i+1,p=state.posts.filter(p=>{let dt=new Date(p.created);return dt.getDate()===d&&dt.getMonth()===month&&dt.getFullYear()===year}).at(-1);return `<button class="day" onclick="showDay(${d})">${p?.photo?`<img src="${p.photo}" alt="">`:''}${d}</button>`}).join('')+'</div><h3>Quero viver</h3>'+(state.experiences.map((x,i)=>`<div class="card row"><span>${safe(x.title)}<br><small class="muted">${x.done?'Já vivi':'Quero viver'}</small></span><button class="secondary" onclick="finishExp(${i})">${x.done?'↺':'✓'}</button></div>`).join('')||'<p class="muted">Suas experiências aparecerão aqui.</p>')};if(page==='ai')html='<h2>VYVA IA ✧</h2><div class="card"><p>Conte sobre sua rotina e seus interesses. Por enquanto, este protótipo oferece ideias simples sem conexão com um modelo de IA.</p><input id="routine" placeholder="Sua rotina" value="'+safe(state.routine)+'"><input id="interests" placeholder="Seus interesses" value="'+safe(state.interests)+'"><button onclick="suggest()">Sugerir experiência</button><div id="suggestion"></div></div>';if(page==='profile')html='<h2>'+safe(state.name)+'</h2><p class="muted">'+state.posts.length+' publicações · '+state.experiences.length+' experiências</p><div class="card"><h3>Sobre mim</h3><input id="profileName" value="'+safe(state.name)+'"><button onclick="updateProfile()">Salvar nome</button></div><div class="card"><h3>Privacidade</h3><p class="muted">Os dados desta demonstração ficam apenas neste navegador, sem sincronização entre aparelhos.</p><button class="secondary" onclick="if(confirm(\'Apagar todos os dados locais?\')){localStorage.removeItem(KEY);location.reload()}">Apagar meus dados locais</button></div>';el.innerHTML=html}function start(){let n=document.getElementById('name').value.trim();if(!n)return alert('Digite seu nome');state.name=n;save();page='feed';render()}function loadPhoto(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let scale=Math.min(1,900/img.width);c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.65)};img.src=reader.result};reader.readAsDataURL(f)}function post(){let caption=document.getElementById('caption').value.trim();if(!caption&&!photo)return alert('Adicione uma foto ou legenda');let now=new Date();state.posts.push({caption,photo,created:now.toISOString(),date:now.toLocaleDateString('pt-BR')});try{save()}catch(e){state.posts.pop();return alert('Armazenamento cheio. Use fotos menores.')}photo='';page='feed';render()}function addExp(){let title=document.getElementById('exp').value.trim();if(!title)return alert('Dê um nome à experiência');state.experiences.push({title,done:false});save();page='calendar';render()}function finishExp(i){state.experiences[i].done=!state.experiences[i].done;save();render()}function showDay(d){let now=new Date();let posts=state.posts.filter(p=>{let dt=new Date(p.created);return dt.getDate()===d&&dt.getMonth()===now.getMonth()&&dt.getFullYear()===now.getFullYear()});alert(posts.length?posts.map(p=>p.caption||'Foto publicada').join('\n'):'Nenhuma publicação neste dia')}function suggest(){state.routine=document.getElementById('routine').value;state.interests=document.getElementById('interests').value;save();let ideas=['Faça um passeio fotográfico de 15 minutos pelo bairro.','Experimente preparar uma receita simples com alguém por videochamada.','Escolha um lugar novo para visitar no próximo dia livre.','Faça uma lista de três coisas que você gostaria de aprender.'];document.getElementById('suggestion').innerHTML='<p><b>Uma ideia para você:</b></p><p>'+ideas[Math.floor(Math.random()*ideas.length)]+'</p><p class="muted">Sugestão demonstrativa, não gerada por IA.</p>'}function updateProfile(){state.name=document.getElementById('profileName').value.trim()||state.name;save();render()}render();
</script></body></html>
