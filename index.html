function welcome(){return `<div class="welcome"><div class="logo">VYVA.</div><div class="feature" style="min-height:270px;margin-top:28px"><div><h3>Viva histórias que valem a pena contar.</h3><p>Descubra, crie e compartilhe experiências.</p></div></div><h1>Menos vontade guardada.<br>Mais vida acontecendo.</h1><p>Uma rede social para transformar ideias em experiências reais.</p><label class="label">Como você quer ser chamado(a)?</label><input id="name" class="field" placeholder="Seu nome"><button class="btn" onclick="start()">Começar a explorar →</button><p class="mini">Demonstração local: não cria uma conta online.</p></div>`}
function authScreen(){const signup=authMode==='signup',reset=authMode==='reset';return `<div class="auth-wrap"><div class="brand">VYVA.</div><h1>${reset?'Recuperar senha':signup?'Criar conta':'Entrar no VYVA'}</h1><p class="sub">Menos vontade guardada. Mais vida acontecendo.</p>${!sb?'<div class="notice">Conexão não configurada. Confira SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY no início do arquivo.</div>':''}<form id="auth-form" onsubmit="submitAuth(event)">${signup?'<label class="label" for="auth-name">Seu nome</label><input class="field" id="auth-name" autocomplete="name" required placeholder="Como quer ser chamado(a)?">':''}<label class="label" for="auth-email">E-mail</label><input class="field" id="auth-email" type="email" autocomplete="email" required placeholder="seu@email.com">${!reset?`<label class="label" for="auth-password">Senha</label><input class="field" id="auth-password" type="password" minlength="6" autocomplete="${signup?'new-password':'current-password'}" required placeholder="Mínimo de 6 caracteres">`:''}<p class="auth-error" id="auth-error" role="alert" aria-live="polite"></p><button id="auth-submit" class="btn" type="submit">${reset?'Enviar link':signup?'Cadastrar':'Entrar'}</button></form><div class="auth-links">${!signup&&!reset?'<button type="button" class="auth-link" onclick="authMode=\'reset\';render()">Esqueci minha senha</button>':''}<button type="button" class="auth-link" onclick="authMode='${signup||reset?'login':'signup'}';render()">${signup||reset?'Voltar para entrar':'Criar uma conta'}</button></div><p class="mini">Suas publicações e experiências ainda ficam neste navegador. A sincronização entre contas será implementada depois.</p></div>`}
function authMessage(error){const msg=String(error?.message||error||'Erro desconhecido');if(/invalid login credentials/i.test(msg))return 'E-mail ou senha incorretos.';if(/email not confirmed/i.test(msg))return 'Seu cadastro foi realizado, mas falta confirmar o e-mail. Abra sua caixa de entrada, clique no link de confirmação e depois tente entrar. Confira também o spam.';if(/user already registered/i.test(msg))return 'Este e-mail já está cadastrado. Tente entrar.';if(/password should be at least/i.test(msg))return 'A senha precisa ter pelo menos 6 caracteres.';if(/invalid path|failed to fetch|network/i.test(msg))return 'Não foi possível conectar ao Supabase. Confira a URL do projeto, a chave pública e a internet. Detalhes: '+msg;return msg}
async function submitAuth(e){e.preventDefault();const error=$('auth-error'),button=$('auth-submit');if(!error||!button)return;error.textContent='';if(!sb){error.textContent='A conexão com Supabase não está configurada. Confira as duas constantes no início do código.';return}const email=$('auth-email').value.trim(),password=$('auth-password')?.value,name=$('auth-name')?.value.trim();button.disabled=true;button.textContent='Aguarde...';try{let result;if(authMode==='signup')result=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});else if(authMode==='reset')result=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});else result=await sb.auth.signInWithPassword({email,password});if(result.error)throw result.error;if(authMode==='reset'){authMode='login';render();toast('Link enviado! Confira seu e-mail.');return}if(authMode==='signup'&&!result.data.session){authMode='login';render();alert('Conta criada! Enviamos um link de confirmação para '+email+'. Abra seu e-mail, clique no link para ativar a conta e depois volte ao VYVA para entrar. Se não encontrar a mensagem, confira o spam.');return}if(result.data.user)acceptUser(result.data.user);else error.textContent='Não foi possível concluir. Tente novamente.'}catch(err){console.error('VYVA autenticação:',err);error.textContent=authMessage(err)}finally{if(button.isConnected){button.disabled=false;button.textContent=authMode==='signup'?'Cadastrar':authMode==='reset'?'Enviar link':'Entrar'}}}
function acceptUser(user){authUser=user;state.name=user.user_metadata?.display_name||user.email?.split('@')[0]||'Você';save();go('feed')}
async function logout(){if(!sb)return;const {error}=await sb.auth.signOut();if(error)return toast(error.message);authUser=null;go('auth')}
async function initAuth(){if(sb){let {data}=await sb.auth.getSession();if(data.session?.user)acceptUser(data.session.user);sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){authUser=null;go('auth')}else if(event==='SIGNED_IN'&&session?.user&&!authUser)acceptUser(session.user)})}render()}
function start(){let n=$('name').value.trim();if(!n)return toast('Digite seu nome');state.name=n;save();go('feed')}
function postCard(p,i){let demo=!!p.demo,liked=!!state.likes[p.id];return `<article class="post"><div class="posthead"><img src="${demo?p.avatar:pics.portrait}" alt=""><div style="flex:1"><b>${esc(p.author||state.name)}</b><small>${esc(p.place||'Minha experiência')} · ${esc(p.date||'Hoje')}</small></div><button class="ico" onclick="toast('Mais opções em breve')">···</button></div>${p.photo?`<img class="postimage" src="${p.photo}" alt="Foto da publicação">`:''}<div class="postbuttons"><div class="left"><button class="ico ${liked?'liked':''}" onclick="like('${p.id}')" aria-label="${liked?'Descurtir':'Curtir'}" aria-pressed="${liked}">${icon('heart')}</button><button class="ico" onclick="toast('Comentários disponíveis na próxima versão')">${icon('message')}</button><button class="ico" onclick="toast('Compartilhamento disponível na próxima versão')">${icon('send')}</button></div><button class="ico ${state.bookmarks[p.id]?'savedicon':''}" onclick="toggleSaved('${p.id}')" aria-label="Salvar publicação">${icon('bookmark')}</button></div><div class="posttext"><strong>${demo?p.likes+(liked?1:0):liked?1:0} curtidas</strong><br><strong>${esc(p.author||state.name)}</strong> ${esc(p.caption)}${p.tags?`<div class="mini">Com ${esc(p.tags)}</div>`:''}${p.music?`<div class="mini">♫ ${esc(p.music)}</div>`:''}</div><div class="postmeta">Ver comentários · ${esc(p.date||'Hoje')}</div></article>`}
const demoPosts=[{id:'d1',demo:true,author:'ana.costa',avatar:pics.portrait,place:'Parque · Natureza',date:'há 2 h',photo:pics.lake,caption:'Hoje resolvi sair sem destino. Às vezes, é disso que a gente precisa. 🌿',likes:324},{id:'d2',demo:true,author:'lucas.ribeiro',avatar:pics.portrait2,place:'Com amigos',date:'ontem',photo:pics.friends,caption:'Uma tarde simples, muitas histórias para lembrar.',likes:186}];function feed(){return `<div class="storyrow">${[['Você',pics.portrait],['Ana',pics.portrait3],['Lucas',pics.portrait2],['Maria',pics.portrait],['Pedro',pics.portrait2]].map(([n,p])=>`<div class="story" onclick="toast('Stories serão adicionados depois')"><img class="avatar" src="${p}">${n}</div>`).join('')}</div>${[...state.posts].reverse().concat(demoPosts).map(postCard).join('')}<p class="mini" style="text-align:center;padding:20px">Prévia: publicações demonstrativas, ainda sem contas conectadas.</p>`}
function like(id){state.likes[id]=!state.likes[id];save();render()}function toggleSaved(id){state.bookmarks[id]=!state.bookmarks[id];save();render();toast(state.bookmarks[id]?'Salvo em sua coleção':'Removido dos salvos')}function saved(){let all=[...state.posts,...demoPosts].filter(p=>state.bookmarks[p.id]);return `<div class="section"><h1 class="heading">Salvos</h1><p class="sub">Suas publicações favoritas ficam aqui neste navegador.</p>${all.length?all.map(postCard).join(''):'<div class="blank">Você ainda não salvou nenhuma publicação.</div>'}</div>`}
function explore(){return `<div class="section"><h1 class="heading">Descubra algo novo</h1><input class="field" id="searchtext" placeholder="Pesquisar experiências, pessoas, lugares" oninput="filterTiles(this.value)"><div class="quick">${['Tudo','Natureza','Gastronomia','Criatividade','Amigos'].map((x,i)=>`<button class="pill ${i===0?'selected':''}" onclick="toast('Filtro ${x} em desenvolvimento')">${x}</button>`).join('')}</div><div class="grid2" id="tiles">${[['Trilhas',pics.hike],['Cafés',pics.coffee],['Fotografia',pics.camera],['Viagens',pics.city],['Amizades',pics.friends],['Paisagens',pics.lake]].map(([n,p])=>`<div class="tile" data-name="${n.toLowerCase()}" onclick="go('create')"><img src="${p}" alt="${n}"><span>${n} →</span></div>`).join('')}</div><div class="panel"><b>✦ Não sabe por onde começar?</b><p class="sub">A VYVA IA pode te ajudar a escolher algo para experimentar.</p><button class="btn" onclick="go('ai')">Conversar com a IA</button></div></div>`}function filterTiles(v){document.querySelectorAll('[data-name]').forEach(x=>x.style.display=x.dataset.name.includes(v.toLowerCase())?'':'none')}
function create(){return `<div class="section"><h1 class="heading">Criar</h1><p class="sub">O que você quer fazer?</p><div class="tabs"><button class="pill ${createType==='experiencia'?'selected':''}" onclick="createType='experiencia';render()">Planejar algo</button><button class="pill ${createType==='post'?'selected':''}" onclick="createType='post';render()">Postar foto</button></div><p class="notice">${createType==='experiencia'?'Planeje algo que você ainda quer viver. Guarde a ideia e organize para fazer depois.':'Compartilhe algo que já aconteceu. Sua foto aparecerá no feed e no calendário de memórias.'}</p>${createType==='experiencia'?`<label class="label">O que você quer viver?</label><input class="field" id="exptitle" placeholder="Ex.: Fazer uma trilha com amigos"><label class="label">Descreva sua ideia</label><textarea class="field" id="expdesc" rows="3" placeholder="O que torna essa experiência especial?"></textarea><label class="label">Quando?</label><select class="field" id="expwhen"><option>Sem data definida</option><option>Em breve</option><option>Este mês</option><option>Neste ano</option></select><label class="label">Quem pode ver?</label><select class="field" id="expprivacy"><option value="private">Só eu</option><option value="friends">Amigos (após conectar contas)</option><option value="public">Público (após conectar contas)</option></select><div class="notice">Você poderá convidar pessoas quando ativarmos as contas reais e os convites pelo Supabase.</div><button class="btn" onclick="addExperience()">Criar experiência →</button>`:`<label class="label">Compartilhe um momento</label><textarea class="field" id="caption" rows="4" placeholder="O que você viveu hoje?"></textarea><label class="label">Marcar pessoas (demonstração)</label><input class="field" id="tags" placeholder="@usuario, @amiga"><label class="label">Música da publicação (referência)</label><input class="field" id="music" placeholder="Nome da música e artista"><p class="mini">A música será exibida como texto. Reprodução e catálogo exigem licenciamento e integração.</p><label class="label">Adicionar foto</label><input class="field" type="file" accept="image/*" onchange="loadPhoto(event)"><div id="preview"></div><button class="btn" onclick="publish()">Publicar no meu feed →</button><p class="mini">As fotos ficam somente neste navegador nesta demonstração.</p>`}</div>`}
function addExperience(){let title=$('exptitle').value.trim();if(!title)return toast('Escreva o nome da experiência');state.experiences.unshift({id:Date.now(),title,desc:$('expdesc').value.trim(),when:$('expwhen').value,privacy:$('expprivacy').value,status:'Quero viver',created:new Date().toISOString()});save();tab='Quero viver';go('life');toast('Experiência criada!')}
function loadPhoto(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,1000/img.width,1000/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.65);$('preview').innerHTML=`<img class="imgpreview" src="${photo}" alt="Prévia da foto">`};img.src=reader.result};reader.readAsDataURL(f)}
function publish(){let caption=$('caption').value.trim();if(!caption&&!photo)return toast('Adicione uma foto ou legenda');state.posts.push({id:'p'+Date.now(),caption,photo,tags:$('tags')?.value.trim()||'',music:$('music')?.value.trim()||'',created:new Date().toISOString(),date:new Date().toLocaleDateString('pt-BR'),author:state.name,likes:0});save();photo='';go('feed');toast('Publicado neste navegador!')}
function life(){let today=new Date(),m=new Date(today.getFullYear(),today.getMonth()+calendarOffset,1),year=m.getFullYear(),month=m.getMonth(),days=new Date(year,month+1,0).getDate(),start=new Date(year,month,1).getDay();let cells=Array.from({length:start},()=>'<div></div>').join('')+Array.from({length:days},(_,i)=>{let d=i+1,p=state.posts.filter(p=>{let t=new Date(p.created);return t.getFullYear()===year&&t.getMonth()===month&&t.getDate()===d&&p.photo}).at(-1);return `<button class="day ${selectedDay===d?'current':''}" onclick="selectedDay=${d};render()">${p?`<img src="${p.photo}" alt="Memória do dia ${d}"><span>${d}</span>`:d}</button>`}).join('');let matches=state.experiences.filter(x=>x.status===tab);let posts=selectedDay?state.posts.filter(p=>{let t=new Date(p.created);return t.getFullYear()===year&&t.getMonth()===month&&t.getDate()===selectedDay}):[];return `<div class="section"><h1 class="heading">Minha vida</h1><p class="sub">Uma coleção de tudo o que você quer viver e já viveu.</p><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><button class="ico" onclick="calendarOffset--;selectedDay=null;render()">${icon('back')}</button><b>${m.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button class="ico" onclick="calendarOffset++;selectedDay=null;render()">${icon('chevron')}</button></div><div class="cal">${['D','S','T','Q','Q','S','S'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div><p class="mini" style="margin-bottom:0">As fotos aparecem no dia em que você publicou.</p></div>${selectedDay?`<div class="panel"><b>${selectedDay} de ${m.toLocaleDateString('pt-BR',{month:'long'})}</b>${posts.length?posts.map(p=>`<p class="sub">${esc(p.caption||'Foto publicada')}</p>${p.photo?`<img class="cover" src="${p.photo}">`:''}`).join(''):'<p class="sub">Nenhuma publicação neste dia.</p>'}</div>`:''}<h2 style="font-size:19px;margin:25px 0 3px">Minhas experiências</h2><div class="tabs">${['Quero viver','Estou vivendo','Já vivi'].map(t=>`<button class="pill ${tab===t?'selected':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div>${matches.length?matches.map(x=>`<div class="listrow"><div class="round">✦</div><div class="info"><b>${esc(x.title)}</b><p>${esc(x.when)}</p></div><button class="ico" onclick="openExperience(${x.id})">${icon('chevron')}</button></div>`).join(''):'<div class="blank">Suas experiências aparecerão aqui.<br>Que tal criar a primeira?</div>'}<button class="btn alt" onclick="createType='experiencia';go('create')">＋ Criar experiência</button></div>`}
let activeExperience=null;function openExperience(id){activeExperience=id;go('experience')}function experienceDetail(){let x=state.experiences.find(x=>x.id===activeExperience);if(!x)return '<div class="section">Experiência não encontrada.</div>';return `<div class="section"><button class="ico" onclick="go('life')">${icon('back')}</button><div class="feature" style="margin:12px 0"><div><h3>${esc(x.title)}</h3><p>Uma experiência para viver no seu tempo.</p></div></div><h1 class="heading">${esc(x.title)}</h1><p class="sub">${esc(x.desc||'Sua próxima experiência começa com uma ideia.')}</p><div class="panel"><b>Status</b><select class="field" id="newstatus" onchange="changeStatus(${x.id},this.value)">${['Quero viver','Estou vivendo','Já vivi'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><b>Planejamento</b><p class="sub">${esc(x.when)}</p><b>Privacidade</b><p class="sub">${x.privacy==='private'?'Somente você':x.privacy==='friends'?'Amigos (pendente de integração)':'Pública (pendente de integração)'}</p></div><button class="btn" onclick="toast('Convites reais exigem login e banco de dados')">${icon('users')} Convidar amigos</button><button class="btn alt" onclick="deleteExperience(${x.id})">Excluir experiência</button></div>`}function changeStatus(id,status){let x=state.experiences.find(x=>x.id===id);x.status=status;save();toast('Status atualizado')}function deleteExperience(id){if(confirm('Excluir esta experiência?')){state.experiences=state.experiences.filter(x=>x.id!==id);save();go('life')}}
function ai(){return `<div class="chat-shell"><div class="chat-title"><div class="spark">✦</div><div><b>VYVA IA</b><div class="mini">Um espaço para conversar e descobrir possibilidades</div></div></div><div class="chat-messages" id="chatmessages">${state.messages.length?state.messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}</div>`).join(''):`<div class="chat-empty"><div style="font-size:38px">✦</div><h2>O que vamos viver hoje?</h2><p>Converse sobre o que você gostaria de fazer, aprender ou experimentar.</p></div>`}</div>${!state.messages.length?`<div class="quick chat-suggestions">${['Tenho pouco tempo','Quero algo gratuito','Algo com meus amigos'].map(t=>`<button class="pill" onclick="askAI('${t}')">${t}</button>`).join('')}</div>`:''}<form class="chat-compose" onsubmit="event.preventDefault();askAI($('aimsg').value)"><textarea id="aimsg" rows="1" placeholder="Pergunte qualquer coisa..."></textarea><button type="submit" aria-label="Enviar">➤</button></form><p class="mini" style="text-align:center;margin:0 12px 10px">Respostas demonstrativas. A conexão com IA real ainda não foi configurada.</p></div>`}function saveMemory(){state.routine=$('routine').value;state.interests=$('interests').value;state.budget=$('budget').value;save();toast('Preferências salvas neste aparelho')}function askAI(q){q=q.trim();if(!q)return;state.messages.push({mine:true,text:q});let r=/feriado/i.test(q)?'Podemos pensar em um passeio, um projeto criativo ou uma experiência com amigos. Você prefere sair de casa ou ficar por perto?':/amig/i.test(q)?'Legal! Vocês preferem se encontrar pessoalmente ou fazer algo juntos à distância?':/gratuit|dinheiro/i.test(q)?'Podemos explorar algo gratuito: uma caminhada fotográfica, um novo hobby ou uma atividade criativa. O que combina mais com você?':'Me conta um pouco mais: quanto tempo você tem e prefere fazer algo sozinho ou acompanhado?';state.messages.push({mine:false,text:r});save();render();setTimeout(()=>{let x=$('chatmessages');if(x)x.scrollTop=x.scrollHeight},0)}
function profile(){let posts=state.posts.filter(p=>p.photo).slice().reverse();return `<div class="profile-screen"><div class="profile-top"><b class="profile-handle">${esc(state.name)}</b><button class="ico profile-menu" onclick="go('settings')" aria-label="Abrir menu e configurações">${icon('menu')}</button></div><div class="profile-summary"><img class="profile-avatar-new" src="${pics.portrait}" alt="Foto do perfil"><div class="profile-numbers"><div><strong>${state.posts.length}</strong><span>publicações</span></div><div><strong>${state.experiences.length}</strong><span>experiências</span></div><div><strong>0</strong><span>amigos</span></div></div></div><div class="profile-bio"><b>${esc(state.name)}</b><p>Vivendo, aprendendo e experimentando.</p></div><div class="profile-actions"><button onclick="openSetting('edit-profile')">Editar perfil</button><button onclick="go('friends')">Amigos</button></div><div class="profile-tabline"><span>${icon('camera')} Publicações</span></div><div class="profile-grid">${posts.map(p=>`<div class="profile-tile"><img src="${p.photo}" alt="Foto publicada"></div>`).join('')||'<div class="profile-empty">Quando você publicar fotos, elas aparecerão aqui.</div>'}</div></div>`}
function settings(){return `<div class="settings-screen"><div class="settings-top"><button class="ico" onclick="go('profile')" aria-label="Voltar ao perfil">${icon('back')}</button><h1>Configurações</h1><span></span></div><div class="settings-group"><h2>Conta e conteúdo</h2><button class="setting-row" onclick="openSetting('edit-profile')">${icon('user')}<span>Editar perfil</span>${icon('chevron')}</button><button class="setting-row" onclick="go('saved')">${icon('bookmark')}<span>Itens salvos</span>${icon('chevron')}</button></div><div class="settings-group"><h2>Preferências</h2><button class="setting-row" onclick="openSetting('appearance')">${icon('moon')}<span>Aparência</span>${icon('chevron')}</button><button class="setting-row" onclick="openSetting('ai-memory')">${icon('spark')}<span>VYVA IA e memória</span>${icon('chevron')}</button></div><div class="settings-group"><h2>Privacidade e dados</h2><button class="setting-row" onclick="openSetting('privacy')">${icon('settings')}<span>Privacidade e dados locais</span>${icon('chevron')}</button></div><div class="settings-group"><button class="setting-row" onclick="logout()">${icon('back')}<span>Sair da conta</span>${icon('chevron')}</button></div><div class="settings-group"><h2>Sobre</h2><div class="setting-row static">${icon('heart')}<span>VYVA — Menos vontade guardada. Mais vida acontecendo.</span></div></div></div>`}
function openSetting(section){let content='';if(section==='appearance')content=`<h2>Aparência</h2><p class="sub">Escolha como o VYVA aparece no seu celular.</p><div class="mode">${[['light','Claro'],['dark','Escuro'],['auto','Automático']].map(([v,n])=>`<button class="pill ${state.theme===v?'selected':''}" onclick="state.theme='${v}';save();render()">${n}</button>`).join('')}</div>`;if(section==='ai-memory')content=`<h2>VYVA IA e memória</h2><p class="sub">Estas informações ficam apenas neste navegador nesta demonstração.</p><label class="label">Trabalho e estudos</label><textarea class="field" id="routine" rows="2" placeholder="Ex.: Trabalho de dia e estudo à noite">${esc(state.routine)}</textarea><label class="label">Interesses</label><input class="field" id="interests" value="${esc(state.interests)}"><label class="label">Orçamento</label><select class="field" id="budget">${['Não informado','Gratuito','Até R$ 30','Até R$ 100','Flexível'].map(v=>`<option ${state.budget===v?'selected':''}>${v}</option>`).join('')}</select><button class="btn" onclick="saveMemory()">Salvar preferências</button>`;if(section==='edit-profile')content=`<h2>Editar perfil</h2><label class="label">Nome</label><input class="field" id="newname" value="${esc(state.name)}"><button class="btn" onclick="state.name=$('newname').value.trim()||state.name;save();toast('Nome salvo');go('profile')">Salvar nome</button>`;if(section==='privacy')content=`<h2>Privacidade e dados locais</h2><p class="sub">Esta versão é uma demonstração sem login real. Os dados são armazenados neste navegador e não sincronizados com outras pessoas.</p><button class="btn alt" onclick="if(confirm('Apagar todos os dados desta demonstração?')){localStorage.removeItem(KEY);location.reload()}">Apagar dados locais</button>`;document.querySelector('main').innerHTML=`<div class="section"><button class="setting-back" onclick="go('settings')">${icon('back')} Configurações</button><div class="settings-detail">${content}</div></div>`}
function notifications(){return `<div class="section"><h1 class="heading">Notificações</h1><div class="panel"><b>Bem-vinda ao VYVA, ${esc(state.name)}!</b><p class="sub">Comece criando sua primeira experiência.</p></div><div class="notice">Curtidas, convites e notificações entre usuários estarão disponíveis após conectar o banco de dados.</div></div>`}function friends(){return `<div class="section"><h1 class="heading">Amigos</h1><p class="sub">Encontre pessoas para viver experiências juntos.</p><div class="notice">Convites e solicitações de amizade precisam de contas reais conectadas ao Supabase.</div><div class="listrow"><img class="thumb" src="${pics.friends}"><div class="info"><b>Experiências compartilhadas</b><p>Convide seus amigos quando a integração estiver ativa.</p></div></div></div>`}function messages(){return `<div class="section"><h1 class="heading">Mensagens</h1><div class="notice">Mensagens privadas serão implementadas com contas reais e proteção de acesso.</div></div>`}initAuth();
</script></body></html>
